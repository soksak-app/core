lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@soksak/client':
        specifier: workspace:*
        version: link:packages/client
      '@soksak/window-check':
        specifier: workspace:*
        version: link:packages/window-check
    devDependencies:
      acorn:
        specifier: 8.18.0
        version: 8.18.0

  apps/browser:
    dependencies:
      '@soksak/workbench':
        specifier: workspace:*
        version: link:../../packages/workbench
    devDependencies:
      '@soksak/plugin-api':
        specifier: workspace:*
        version: link:../../packages/plugin-api
      fake-indexeddb:
        specifier: ^6.2.5
        version: 6.2.5

  apps/tauriv2:
    dependencies:
      '@soksak/workbench':
        specifier: workspace:*
        version: link:../../packages/workbench
    devDependencies:
      '@soksak/plugin-api':
        specifier: workspace:*
        version: link:../../packages/plugin-api

  apps/wailsv3:
    dependencies:
      '@soksak/workbench':
        specifier: workspace:*
        version: link:../../packages/workbench
    devDependencies:
      '@soksak/plugin-api':
        specifier: workspace:*
        version: link:../../packages/plugin-api

  e2e:
    dependencies:
      '@soksak/client':
        specifier: workspace:*
        version: link:../packages/client
      '@soksak/window-check':
        specifier: workspace:*
        version: link:../packages/window-check

  native/darwin/process-identity: {}

  packages/client: {}

  packages/host/tauriv2: {}

  packages/host/wailsv3: {}

  packages/log-contract:
    devDependencies:
      '@soksak/plugin-api':
        specifier: workspace:*
        version: link:../plugin-api

  packages/mcp:
    dependencies:
      '@soksak/client':
        specifier: workspace:*
        version: link:../client

  packages/plugin-api:
    dependencies:
      es-module-lexer:
        specifier: ^3.0.4
        version: 3.0.4
    devDependencies:
      jsdom:
        specifier: ^30.0.1
        version: 30.0.1

  packages/soksak:
    devDependencies:
      fake-indexeddb:
        specifier: ^6.2.5
        version: 6.2.5
      jsdom:
        specifier: ^30.0.1
        version: 30.0.1
      typescript:
        specifier: 7.0.2
        version: 7.0.2

  packages/window-check:
    dependencies:
      '@parcel/watcher':
        specifier: 2.6.0
        version: 2.6.0
      '@soksak/client':
        specifier: workspace:*
        version: link:../client
      '@soksak/log-contract':
        specifier: workspace:*
        version: link:../log-contract

  packages/workbench:
    dependencies:
      '@soksak/plugin-api':
        specifier: workspace:*
        version: link:../plugin-api
      soksak:
        specifier: workspace:*
        version: link:../soksak
    devDependencies:
      '@soksak/runtime':
        specifier: link:test/runtime
        version: link:test/runtime
      jsdom:
        specifier: ^30.0.1
        version: 30.0.1

