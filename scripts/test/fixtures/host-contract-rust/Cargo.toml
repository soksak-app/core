[package]
name = "featurebinary"
version = "0.0.1"
edition = "2021"
publish = false

# The fixture is a workspace of its own, so the root workspace of the repository does not take it.
[workspace]

# A run with the feature builds the binary probe with it, which then names it.
[features]
other = []

[[bin]]
name = "probe"
path = "src/main.rs"
