# The Rust workspace. Its crates share one Cargo.lock and one target/ folder.
[workspace]
resolver = "2"
members = ["apps/tauriv2", "packages/host/rust", "packages/host/tauriv2", "packages/host/tauriv2/tests/fixtures/window-race", "packages/sok/rust"]

# rustc reports an ld warning that an object was built for a newer macOS version than the link through the lint linker_info,
# which is allowed by default, so a build would not print it; the runners fail a build that prints it
# (scripts/macos-minimum.mjs, docs/spec/hosts.md#nativedarwin).
[workspace.lints.rust]
linker_info = "warn"

[profile.dev]
incremental = true

# The index and the query read every line of an event file ([logging](docs/spec/logging.md#query)); the test of 1,000,000 events measures
# the optimization level that ships, because an unoptimized parser is more than twenty times slower.
[profile.dev.package.soksak-sok]
opt-level = 3

[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# The release executable drops its symbol table, as the `-s -w` of the Wails release build does. The check for diagnostic
# code reads the strings that remain without symbols (scripts/check-release.mjs).
[profile.release]
strip = true

# The proc-macro libraries and build scripts that the release build makes for the host are not stripped: no release carries
# them, and on macOS 27 dyld refuses a proc-macro library that was stripped for the deployment target of the Makefile
# (`mis-aligned LINKEDIT string pool`), so rustc cannot load it.
[profile.release.build-override]
strip = false
# tao 0.37.2 calls activateIgnoringOtherApps(false) at launch when an application does not ignore other applications,
# and that call activates the application when no other application is active, so a background relaunch can come to
# the front (docs/spec/hosts.md#launch-activation). The fork release tao-v0.37.2-soksak.1, built on tag tao-v0.37.2, makes no
# call in that case and leaves the activation to Launch Services. The override is removed when a tao release on crates.io
# carries the change.
# wry 0.57.0 calls NSApplication activate (activateIgnoringOtherApps: before macOS 14) at the creation of every webview, and
# macOS grants that activation when no other application is active, so a background Tauri host that opens a window or a view
# can come to the front (docs/spec/hosts.md#launch-activation). The fork release wry-v0.57.0-soksak.1, built on tag
# wry-v0.57.0, makes no activation call at the creation and leaves the activation to the show of the window. The override is
# removed when a wry release on crates.io carries the change.
[patch.crates-io]
tao = { git = "https://github.com/min-0-max/tao", tag = "tao-v0.37.2-soksak.1" }
wry = { git = "https://github.com/min-0-max/wry", tag = "wry-v0.57.0-soksak.1" }
