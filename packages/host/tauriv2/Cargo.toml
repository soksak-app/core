[package]
name = "soksak-host-tauriv2"
version = "0.0.1"
edition = "2021"
description = "soksak native host for Tauri v2"

[lib]
path = "src/host.rs"

# diagnostics 는 진단 엔드포인트 메서드를 포함한다. 릴리스 빌드는 포함하지 않는다.
[features]
diagnostics = []

[build-dependencies]
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tauri-plugin-dialog = "2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }
