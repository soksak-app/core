[package]
name = "soksak-host-tauriv2"
version = "0.0.37"
edition = "2024"
description = "Tauri v2 framework adapter of the soksak host"

[lib]
path = "src/host.rs"

# diagnostics adds the diagnostic endpoint methods and the diagnostic command line; debug builds and 0.0.x releases
# set it. dev selects the .dev identifier of a debug build.
[features]
diagnostics = ["soksak-host/diagnostics"]
dev = ["soksak-host/dev"]

[dependencies]
# compression 은 애플리케이션 크레이트가 끈다. 기본 기능을 켜면 기능 통합으로 다시 켜지므로 끈다.
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "unstable"] }
serde = { version = "1", features = ["derive"] }
soksak-host = { path = "../rust" }
soksak-sok = { path = "../../sok/rust" }
serde_json = { version = "1", features = ["raw_value"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
# The controller that tauri gives is passed to soksak-host as a raw COM pointer, and the process failures of a web view are read from it.
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation"] }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
tempfile = "3"
