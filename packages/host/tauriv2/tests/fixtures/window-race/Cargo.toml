# The fixture program of tests/window_race_test.rs: a real Tauri application whose main thread runs the event loop of wry, with
# hidden windows, which plays one scenario of the main-thread steps of the host and prints its result.
[package]
name = "sok-window-race"
version = "0.0.40"
edition = "2024"
publish = false
description = "Fixture of the main-thread step tests of the Tauri host"

[[bin]]
name = "sok-window-race"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "unstable"] }
soksak-host = { workspace = true }
soksak-host-tauriv2 = { workspace = true }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lints]
workspace = true
