[package]
name = "soksak-host"
version = "0.0.40"
edition = "2024"
description = "soksak Rust language host library"

[lib]
path = "src/host.rs"

# diagnostics adds the diagnostic endpoint methods and the diagnostic command line; debug builds and 0.0.x releases
# set it. dev selects the .dev identifier of a debug build.
[features]
diagnostics = ["soksak-sok/diagnostics"]
dev = ["soksak-sok/dev"]
# host-test links the native host test library (native/darwin/tests/support) for the tests that run a handled crash child.
host-test = []

# The fatal tests start a child whose crash exceptions the host test library answers; they need host-test.
[[test]]
name = "fatal_exception_test"
required-features = ["host-test"]

[[test]]
name = "fatal_signal_test"
required-features = ["host-test"]

# The page start calls the native layout, which runs only on the main thread, and the test harness runs each test on a
# thread of its own, so this target runs its tests on the main thread of its process; it answers --list and --exact as the
# harness does.
[[test]]
name = "page_start_main_thread_test"
harness = false
required-features = ["host-test"]

# The reports of the memory pressure source belong to the main thread, so this target runs its tests on the main thread of its
# process; it answers --list and --exact as the harness does.
# The binary store of a view belongs to its native document, and the native layer runs only on the main thread, so this target runs
# its tests on the main thread of its process with a real window, surface and view; it answers --list and --exact as the harness does.
[[test]]
name = "view_binary_test"
harness = false
required-features = ["host-test"]

[[test]]
name = "memory_pressure_test"
harness = false

# The hold of a new window is native AppKit state, which belongs to the main thread, so this target runs its tests on the main
# thread of its process against the real recorder of the platform; it answers --list and --exact as the harness does.
[[test]]
name = "recording_hold_test"
harness = false
required-features = ["diagnostics"]

# The heartbeat of the stall watch is answered by the main run loop of a process, and the libtest harness runs each test on a
# thread of its own, so this target runs its tests on the main thread of its process and each test runs its scenario in a child
# process of the same binary, whose main thread runs the run loop; it answers --list and --exact as the harness does.
[[test]]
name = "stall_watch_test"
harness = false

# A measurement prints numbers and asserts nothing (docs/spec/logging.md#writers).
[[bench]]
name = "event_log_benchmark"
harness = false

[[bench]]
name = "event_native_benchmark"
harness = false

[build-dependencies]
pkg-config = "0.3"

[dependencies]
serde = { version = "1", features = ["derive"] }
# 설치 형식과 설치 배치는 command line sok 의 구현을 쓴다(docs/spec/installation.md).
soksak-sok = { path = "../../sok/rust" }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
crc32fast = "1"
url = "2"
# The start document answers the request of the scheme handler of the framework as an HTTP response.
http = "1"
# The surface presentation waits for its main-thread step on a channel of the asynchronous runtime, and the host builds that
# runtime (routine.rs async_runtime).
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
# The session file name is the RFC 3986 percent-encoding of the session id (workspace.rs tab_session_name).
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.7"
# exception catches an Objective-C exception where a thread, a main-thread step or a blocking task of the host starts, so the
# process ends with its record (platform.rs end_on_exception).
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
# webview2-com names its COM types with this major version of windows, so the two match.
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hex = "0.4"
notify = "8.2"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The stall watch test runs the main run loop of its child process on the main thread (tests/stall_watch_test.rs).
core-foundation = "0.10"

[lints]
workspace = true
