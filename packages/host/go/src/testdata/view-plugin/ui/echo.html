<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>probe view that echoes</title>
<script>
// The view reports to the host through the sok-view handler, as the channel script of the application does. After it opened, this page sends
// nothing of its own: each message that the host posts to the document is reported back as a call whose params are the message.
const send = (message) => window.webkit.messageHandlers['sok-view'].postMessage(message);
// The ids of the echoes are far above the ids that a test gives its own calls.
let calls = 1000000;
// The host posts to a document only after the address of the document committed, so the call that reports the opening tells the test that
// the document takes posts.
send({ sok: 1, id: ++calls, command: 'probe.opened', params: { href: location.href } });
window.addEventListener('message', (event) => send({ sok: 1, id: ++calls, command: 'probe.received', params: event.data }));
</script>
</head>
<body></body>
</html>
