[package]
name = "soksak-sok-tauriv2"
version = "0.0.3"
edition = "2021"
description = "Command line sok of the Tauri application"

[features]
# 진단 build 의 명령(capture)을 둔다. 디버그 bundle 의 sok 만 켠다.
diagnostics = []

[lib]
name = "soksak_sok"
path = "src/sok.rs"

[[bin]]
name = "sok"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"
