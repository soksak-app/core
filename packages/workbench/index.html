<!-- 창의 크롬. 브랜드, 프로젝트 탭, 그리고 자주 쓰는 스위치.
     프로젝트 탭은 설정에 따라 여기 서거나 왼쪽 세로 레일로 간다. -->
<header class="chrome-bar" data-expose="core.chrome.bar">
  <!-- 창을 끄는 영역. 막대의 빈 곳 전체를 덮고, 단추와 탭은 그 위에 배치된다.
       막대 자체에 표시하면 그 표시가 자식에게 상속되어 단추를 눌러도 창이
       이동한다. -->
  <div class="chrome-bar__drag" id="winDrag"></div>
  <!-- soksak 로고. 아이콘 타일의 색은 고정이고, 글자는 모드에 따라 app.css 의 .brand 색을 따른다. -->

      <svg x="102" y="19.375" width="221.25" height="41.25" viewBox="-1 15 236 44"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M27 25 C24 20.5 19 19 15 19 C8 19 4 22.5 4 27.5 C4 33 10 35 15.5 36 C21.5 37 28 39 28 46 C28 52 22.5 55 16 55 C10.5 55 6 53 3 49"/><circle cx="56" cy="37" r="18"/><path d="M88 19 V55 M108 19 L88 37 M88 37 L110 55"/><path transform="translate(120,0)" d="M27 25 C24 20.5 19 19 15 19 C8 19 4 22.5 4 27.5 C4 33 10 35 15.5 36 C21.5 37 28 39 28 46 C28 52 22.5 55 16 55 C10.5 55 6 53 3 49"/><circle cx="174" cy="37" r="18"/><path d="M192 19 V55"/><path d="M208 19 V55 M228 19 L208 37 M208 37 L230 55"/></g></svg>

<!-- 프로젝트 탭이 왼쪽에 설 때, 레일이 이 안의 첫 자리에 생긴다. 스페이스 줄보다
     위에서 시작해 아래까지 내려간다 — 프로젝트가 스페이스를 담기 때문이다. -->

<!-- 애플리케이션마다 같은 문서를 사용한다. 런타임 차이는 @soksak/runtime 이 담당하고,
     플러그인과 기본값은 environment.json 이 정한다. -->
<script src="./background.js"></script>
<script type="module" src="./host.js"></script>
<script type="module">
/* environment.json 을 가장 먼저 불러온다. 아래 모듈은 등록된 플러그인과 기본값을
   함수 호출 시점에 읽는다. */
import { loadEnvironment } from "./environment.js";
import { pluginOperations } from "./installed-plugins.js";
import { loadExposure } from "./exposure.js";
import { openStore, windows } from "@soksak/runtime";

import { installTheme } from "soksak";

/* 판 외부의 값은 settings 가 갖는다. 이 문서는 값이 바뀌었을 때 판을 다시 만든다.
   설정이 판을 직접 호출하면 설정을 추가할 때마다 호출할 함수를 정해야 한다. */
import {
  halfGap, install, modeName, onSettingsChange, value, connectSettings,
} from "./settings.js";

/* 표면을 모사하고 보고한다. 판은 슬롯 요소에 값을 기록만 하고 측정과 보고는 이쪽이
   담당한다. */
import { latest, onCommit, onRun, publish, publishAhead } from "./compositor.js";
import { authorizeSurface, disposeSurfacesExcept, focusSurface, waitSurfaceCompositionDeclared } from "./surface-modules.js";

/* 판 하나. 이 문서는 판의 렌더링 방식을 알지 않고 렌더 완료만 수신한다. */
import {
  currentGrid, onLayout, onRender, takeSurfaceFocus, setGap, settle, tabsOf,
} from "./plane.js";

/* 판과 컴포지터를 읽어 검증한다. 아무것도 변경하지 않으므로 그 둘은 이 모듈을
   알지 않는다. */
import { verify } from "./verify.js";
import { animationFrame, createLayoutQueue, drawPrepared } from "./layout-queue.js";
import { trace } from "./performance.js";

/* 애플리케이션 인터페이스. 없으면 아무 일도 하지 않는 구현이 온다. */
import { chrome, onMenuCommand, retainSidecarSessions, surfaces as host } from "./host.js";
import { setTextScope } from "./text-size.js";

/* 코어의 공개 항목과 진단 메서드. 등록소가 호스트의 요청에 답한다. */
import { coreChanged, installCoreExposure, setVerify } from "./core-exposure.js";
/* 진단 빌드에서만 진단 메서드가 들어 있다. 다른 빌드에서는 빈 모듈이다. */
import "./diagnostics.js";

/* 프로젝트와 그 안의 스페이스. 판은 한 번에 스페이스 하나를 그리고, 전환은 현재
   상태를 저장한 뒤 다른 상태를 적용하는 것이다. */
import * as projects from "./projects.js";
import * as registry from "./registry.js";
import { rejectionLine } from "./rejection.js";

/* 설정 모달. 사이드바를 연결할 자리 목록은 등록된 플러그인이 정한다. */
import { drawSettings } from "./settings-ui.js";
import { bind, run } from "./commands.js";
import { icon } from "./icons.js";
import { adopt, capture, fresh, clear, onDrag } from "./plane.js";
import { checkStoredLayout } from "./stored-layout.js";
import { onChoicesChange } from "./sidebar-sections.js";

import { createLibrary } from "./library.js";

// 호스트가 이전 페이지의 상태를 정리한 뒤에 등록하고 표면을 올린다(docs/spec/native-host.md).
await windows.started();
await Promise.all([loadExposure(), loadEnvironment()]);
// 불러오지 않은 플러그인의 탭은 설치 상태에 따라 자리 표시의 이유가 정해지므로 첫 스페이스 전에 읽는다
// (docs/spec/plugins.md). 읽기 실패는 그 상태의 오류로 남는다.
await pluginOperations.refresh();

// 선과 divider 의 모양은 이 시트가 정의한다. 이 문서는 색만 지정하고 아래 :root 가
// 그 토큰을 이 문서의 색에 연결한다.
installTheme(document);

/* 설정값을 문서 루트에 설정한다. 스타일시트가 그 값을 읽는다. */
install();

/* 처리되지 않은 오류를 애플리케이션 로그로 보낸다. 애플리케이션에는 콘솔이 없다. */
addEventListener("error", (e) =>
  host.report(`error: ${e.message} @ ${e.filename}:${e.lineno}`));
addEventListener("unhandledrejection", (e) => {
  host.report(rejectionLine(e.reason));
  showError(e.reason);
});
addEventListener("error", (e) => showError(e.message));
function showError(reason) {
  let el = document.getElementById("applicationError");
  if (!el) {
    el = document.createElement("div");
    el.id = "applicationError";
    el.setAttribute("role", "alert");
    document.querySelector("header").after(el);
  }
  el.textContent = String(reason);
  coreChanged();
}

/* ── 배선 ─────────────────────────────────────────────────────────────── */

/**
 * 검증을 실행하고 결과가 달라졌을 때만 기록한다.
 *
 * 검증은 렌더마다 실행된다. 매번 기록하면 같은 줄이 반복되어 변경 시점을 알 수 없다.
 *
 * 같음은 실행 하나 안에서만 따진다. 애플리케이션 하나가 경계를 여러 번 몰므로,
 * 일생에 걸쳐 따지면 두 번째 실행부터는 결과가 어디에도 남지 않는다.
 */
let lastSaid = "";
let layoutFailure = null;

onRun((going) => {
  if (going) lastSaid = "";
});

function check() {
  if (!currentGrid() || projects.inLibrary()) return;
  const rows = verify(controlsAt);
  if (layoutFailure) rows.push({ name: "Surface presentation", ok: false, note: layoutFailure.message });
  setVerify(rows);
  const failed = rows.filter((r) => !r.ok);
  const line = failed.length === 0
    ? `verify: ${rows.length} pass`
    : `verify: ${failed.length} fail — ` +
      failed.map((r) => `${r.name} (${r.note})`).join(" · ");
  if (line === lastSaid) return;
  if (failed.length === 0) console.log(line);
  else console.error(line);
  // 애플리케이션은 자체 로그에 기록한다. 호스트가 없으면 콘솔에만 남는다.
  lastSaid = line;
  host.report(line);
}

/* 표면이 하나도 서지 않는 자리. 잠든 표면은 크기가 없다. */
const NOWHERE = { x: 0, y: 0, w: 0, h: 0 };

/**
 * 지금 그려지지 않는 탭들의 표면.
 *
 * 표면은 탭마다 하나이고, 보이는 것은 그려지는 카드의 활성 탭뿐이다. 나머지도
 * 선언해야 호스트가 살려 둔다 — 그래야 스페이스나 프로젝트를 넘나들어도 셸과
 * 페이지가 그대로다. 선언하지 않으면 호스트가 없는 표면으로 보고 없앤다.
 */
function dormant(shown) {
  const seen = new Set(shown.map((s) => s.id));
  const out = [];
  const add = (tab) => {
    // 불러오지 않은 플러그인의 탭은 표면이 없고 자리 표시만 있다(docs/spec/plugins.md).
    if (seen.has(tab.id) || !registry.hasPlugin(tab.plugin)) return;
    seen.add(tab.id);
    out.push({
      id: tab.id, plugin: tab.plugin, layer: 0,
      declared: NOWHERE, applied: NOWHERE, visible: false, dim: false,
      surface: registry.plugin(tab.plugin).surface(tab.id),
    });
  };
  // 지금 판의 탭들. 활성 탭이 아닌 것이 여기서 걸린다.
  for (const card of currentGrid()?.cards ?? []) for (const t of tabsOf(card)) add(t);
  // 다른 스페이스의 탭들. 활성 스페이스는 저장된 배치가 아니라 위의 판이 맞다.
  const here = projects.active();
  for (const p of projects.local()) {
    for (const space of p.spaces) {
      if (!projects.inLibrary() && p === here && space.id === here.activeSpaceId) continue;
      for (const card of space.layout.state.cards) {
        for (const t of card.data?.tabs ?? []) add(t);
      }
    }
  }
  return out;
}

/* 커밋이 끝나면 호스트에 표면을 알린다. 컴포지터는 이 판의 표면만 알고, 무엇이
   살아 있어야 하는지는 이 문서가 안다. 호스트의 답을 그대로 돌려준다. */
onCommit((record) => {
  const all = [...record.surfaces, ...dormant(record.surfaces)];
  const ids = new Set(all.map((surface) => surface.id));
  // 불러오지 않은 플러그인의 탭은 표면이 아니지만 자리 표시가 살아 있어야 한다(docs/spec/plugins.md).
  for (const card of currentGrid()?.cards ?? []) {
    for (const tab of tabsOf(card)) if (!registry.hasPlugin(tab.plugin)) ids.add(tab.id);
  }
  return disposeSurfacesExcept(ids).then(() => {
    const placed = host.place({ ...record, surfaces: all });
    return Promise.resolve(placed).then((answer) => {
      for (const surface of record.surfaces) authorizeSurface(surface.id);
      return answer;
    });
  });
});

/* 판이 다시 그려지면 검증하고 표면을 보고한다. 판은 둘을 알지 않고 둘은 판을 읽기만
   하므로 이 문서에서 연결한다. */
let presented = Promise.resolve();
onRender(() => {
  const done = publish();
  presented = Promise.resolve(done);
  const record = latest();
  presented = presented.then(() => {
    if (latest() !== record) return false;
    layoutFailure = null;
    check();
    coreChanged();
    if (record?.settled !== false) {
      projects.keep();
      reportSuperseded();
    }
    return true;
  }).then(async () => {
    if (latest() !== record) return;
    const surfaceId = takeSurfaceFocus();
    if (surfaceId) await focusSurface(surfaceId);
  });
});

/* 네이티브 표면 준비가 완료된 뒤 카드 DOM을 갱신한다. */
let drawing = Promise.resolve();
/* 표시되기 전에 더 새 배치로 대신된 배치의 수. 움직임이 멈춘 표시에서 애플리케이션 로그에
   한 줄로 남긴다. 움직이는 동안 배치마다 호스트를 부르면 표시가 그만큼 늦어진다. */
let supersededLayouts = 0;
function reportSuperseded() {
  if (supersededLayouts === 0) return;
  host.report(`layout: ${supersededLayouts} waiting layouts were replaced by newer layouts before presentation`);
  supersededLayouts = 0;
}
const layouts = createLayoutQueue({
  failed(error) {
    layoutFailure = error;
    const message = String(error?.message ?? error);
    console.error(`surface presentation failed: ${message}`);
    showError(`surface presentation failed: ${message}`);
    setVerify([{ name: "Surface presentation", ok: false, note: message }]);
  },
  superseded() {
    supersededLayouts++;
  },
});
let layoutEpoch = 0;
/* 성능 기록의 배치 번호. 기록이 켜져 있으면 배치마다 대기, 준비 응답, DOM 그리기 전후, animation frame, 표시의
   시각(performance.now, ms)을 남겨 배치가 화면에 늦게 나오는 단계를 가린다. */
let layoutTraceId = 0;
onLayout((made, draw, seated) => {
  const epoch = layoutEpoch;
  const id = ++layoutTraceId;
  const mark = (phase) => trace("layout", { phase, id, t: performance.now() });
  mark("queued");
  drawing = layouts.run(() => drawPrepared({
    epoch, current: () => layoutEpoch,
    prepare: async () => { mark("prepare"); const result = await publishAhead(made, seated); mark("prepared"); return result; },
    draw: () => { mark("draw"); draw(); mark("drawn"); },
    frame: async () => { await animationFrame(); mark("frame"); },
    presented: async () => { await presented; mark("presented"); },
  }));
});

// 사이드바의 탭 선택과 접기는 스페이스에 저장한다(docs/spec/projects.md#persistence).
onChoicesChange(() => projects.keep());

/* 스페이스가 바뀌면 현재 판을 저장하고 다른 상태를 적용한다. 프로젝트 전환도 같은
   동작이다. */
projects.onSwitch({ check: checkStoredLayout, save: capture, load: adopt, update: settle, async presented() {
  await drawing;
  // `draw()`는 onRender 커밋이 끝나기 전에 반환한다. 최신 네이티브 배치가
  // 대기 중이면 프로젝트 명령은 완료되지 않은 상태다.
  await presented;
  await host.waitPresented();
}, async empty() {
  layoutEpoch++;
  drawing = layouts.run(async () => {
    clear();
    await publish();
  });
  await drawing;
} });


/* ── 프로젝트와 스페이스 행 ─────────────────────────────────────────────
   프로젝트를 전환하면 스페이스 목록 전체가, 스페이스를 전환하면 판의 배치 전체가
   교체된다. 같은 동작이므로 경로가 하나다.                                */

const projectBar = document.getElementById("projectBar");
const workarea = document.getElementById("workarea");
const spaceBar = document.getElementById("spaceBar");
const chromeActs = document.getElementById("chromeActs");

/* 창을 끄는 영역과, 창이 그리는 단추가 차지하는 영역.

   단추는 OS 가 그린다. 제목 표시줄만 투명하고 콘텐츠가 창 전체를 차지하므로 그
   단추가 이 막대 위에 배치된다. 그 폭은 호스트에 요청해서 받고, 막대의 왼쪽을
   그만큼 비운다.

   브라우저에는 창이 없다. 그때 chrome 은 null 이고 막대를 들여쓰지 않는다. */
let controlsAt = null;

if (chrome) {
  chrome.draggable(document.getElementById("winDrag"));
  askControls();
  // 창의 크기가 바뀌면 OS 가 단추를 다시 배치하므로, 그 영역을 다시 요청한다.
  addEventListener("resize", askControls);
}

/** 창이 그리는 단추의 영역과 제목줄 높이를 요청하고, 첫 행의 들여쓰기와 높이를 설정한다. */
function askControls() {
  chrome.controls().then((answer) => {
    const at = answer?.controls;
    if (!at || at.w <= 0) return;
    controlsAt = at;
    document.documentElement.style.setProperty("--controls-w", `${at.x + at.w}px`);
    // 창은 제목줄 높이의 세로 가운데에 단추를 둔다. 전체 화면처럼 제목줄이 없으면 0 이고,
    // 그때는 쓰던 높이를 지킨다.
    if (answer.row > 0) document.documentElement.style.setProperty("--chrome-h", `${answer.row}px`);
    // 답이 도착해도 렌더는 발생하지 않는다. 네이티브 배치와 DOM을 함께 표시한 뒤
    // 검증해야 이전 프레임을 새 선언과 비교하지 않는다.
    Promise.resolve(presented).then(check);
  });
}

/** 크롬 행의 아이콘 버튼 하나를 만든다. 누르면 command 를 params 로 실행한다. */
function act(name, title, on, command, params, expose) {
  const b = document.createElement("button");
  b.className = "act";
  b.dataset.expose = expose;
  b.type = "button";
  b.title = title;
  b.dataset.on = String(on);
  b.innerHTML = icon(name);
  bind(b, command, params);
  return b;
}

/**
 * 탭 하나를 만든다. 클릭은 전환, 더블클릭은 이름 변경, ✕ 는 닫기다. 셋 다 명령이다.
 *
 *   pick    {command, params}
 *   close   {command, params} 또는 없음
 *   rename  {kind, id} 또는 없음
 */
function tab(text, on, { dot, pick, close, rename, expose, closeExpose }) {
  if (rename && renaming?.kind === rename.kind && renaming.id === rename.id) return renameField(text);
  const el = document.createElement("button");
  el.className = "bar-tab";
  el.dataset.expose = expose;
  el.type = "button";
  el.dataset.on = String(on);
  el.title = text;
  // 프로젝트 색은 선택된 탭의 배경으로 표시한다. 별도 표식을 두지 않는다.
  if (dot && on) el.style.background = `color-mix(in srgb, ${dot} 24%, transparent)`;
  const name = document.createElement("span");
  name.className = "bar-tab__name";
  name.textContent = text;
  el.appendChild(name);
  bind(el, pick.command, pick.params);
  if (rename) {
    el.dataset.rename = JSON.stringify(rename);
    el.addEventListener("dblclick", () => run("core.rename.begin", rename));
  }
  if (close) {
    const x = document.createElement("span");
    x.className = "bar-tab__x";
    x.dataset.expose = closeExpose;
    x.setAttribute("role", "button");
    x.textContent = "✕";
    bind(x, close.command, close.params, { stop: true });
    el.appendChild(x);
  }
  return el;
}

/* 진행 중인 이름 변경. {kind: "project"|"space", id, value}. */
let renaming = null;

/** 이름 변경 중인 탭 자리의 입력 칸. Enter 는 확정, Escape 는 취소, 초점을 잃으면 확정한다. */
function renameField(was) {
  const input = document.createElement("input");
  input.className = "bar-tab__root";
  input.dataset.expose = "core.rename.input";
  input.value = renaming.value ?? was;
  // 입력한 값은 core.rename.set 으로 기록한다. 확정은 그 값을 쓴다.
  bind(input, "core.rename.set", () => ({ value: input.value }), { event: "input" });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") return run("core.rename.commit");
    if (e.key === "Escape") return run("core.rename.cancel");
  });
  input.addEventListener("focusout", () => { if (renaming) return run("core.rename.commit"); });
  queueMicrotask(() => { if (input.isConnected) { input.focus(); input.select(); } });
  return input;
}

/** 이름 변경 명령이 부르는 연산. */
const renames = {
  begin({ kind, id }) {
    const list = kind === "project" ? projects.all() : kind === "space" ? projects.active()?.spaces ?? [] : null;
    if (!list) throw new Error(`unknown rename target ${kind}`);
    const found = list.find((item) => item.id === id);
    if (!found) throw new Error(`no ${kind} ${id}`);
    renaming = { kind, id, value: found.title };
    drawBars();
    coreChanged();
  },
  set(value) {
    if (!renaming) throw new Error("nothing is being renamed");
    renaming.value = String(value);
    coreChanged();
  },
  async commit() {
    if (!renaming) throw new Error("nothing is being renamed");
    const { kind, id, value } = renaming;
    renaming = null;
    const title = value.trim();
    if (title) {
      if (kind === "project") await projects.rename(id, title);
      else projects.renameSpace(id, title);
    }
    drawBars();
    coreChanged();
  },
  cancel() {
    if (!renaming) throw new Error("nothing is being renamed");
    renaming = null;
    drawBars();
    coreChanged();
  },
  state: () => renaming && { ...renaming },
};

/** 「+」 버튼을 만든다. */
function addTabButton(text, command, expose) {
  const b = document.createElement("button");
  b.className = "bar-tab bar-tab--add";
  b.dataset.expose = expose;
  b.type = "button";
  b.textContent = text;
  bind(b, command);
  return b;
}

function drawBars() {
  const here = projects.active();
  const browsing = projects.inLibrary();
  document.body.dataset.screen = browsing ? "library" : "workspace";
  const toLeft = !browsing && value("projectTabs") === "left";
  /* 프로젝트 열은 왼쪽 모드에서만 만든다. 숨기지 않고 제거한다. [hidden] 은 display 를
     정하는 규칙을 이기지 못하고 .project-column 는 display:flex 이므로, 숨기면 빈
     영역이 남는다. 크롬 행은 반대로 항상 둔다. 비어 있어도 그 행이 버튼들을
     오른쪽으로 밀어낸다. */
  let column = workarea.querySelector(".project-column");
  if (toLeft && !column) {
    column = document.createElement("div");
    column.className = "project-column";
    column.dataset.expose = "core.projects.column";
    workarea.prepend(column);
  } else if (!toLeft && column) {
    column.remove();
    column = null;
  }
  const into = toLeft ? column : projectBar;
  projectBar.textContent = "";
  if (column) column.textContent = "";

  for (const p of browsing ? [] : projects.all()) {
    const el = tab(p.title, p.id === here?.id, {
      dot: p.color,
      expose: "core.project-tab",
      closeExpose: "core.project-tab.close",
      pick: { command: "core.project.activate", params: { id: p.id } },
      rename: { kind: "project", id: p.id },
      close: { command: "core.project.close", params: { id: p.id } },
    });
    // 끌어 놓은 순서 변경은 core.project.move 가 만든다.
    if (el.tagName === "BUTTON") {
      el.draggable = true;
      el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", p.id));
      el.addEventListener("dragover", (e) => e.preventDefault());
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        const ids = projects.all().map((p) => p.id);
        const from = ids.indexOf(e.dataTransfer.getData("text/plain"));
        if (from >= 0) return run("core.project.move", { id: ids[from], delta: ids.indexOf(p.id) - from });
      });
    }
    into.appendChild(el);
  }
  if (!browsing) into.appendChild(addTabButton("+", "core.projects.browse", "core.project-tab.add"));

  spaceBar.textContent = "";
  for (const sp of here?.spaces ?? []) {
    spaceBar.appendChild(tab(sp.title, sp.id === here.activeSpaceId, {
      expose: "core.space-tab",
      closeExpose: "core.space-tab.close",
      pick: { command: "core.space.activate", params: { id: sp.id } },
      rename: { kind: "space", id: sp.id },
      close: here.spaces.length > 1 ? { command: "core.space.close", params: { id: sp.id } } : null,
    }));
  }
  if (here) spaceBar.appendChild(addTabButton("+", "core.space.add", "core.space-tab.add"));

  // 크롬 단추는 한 번 만든 요소를 유지하고 바뀐 속성만 고친다. 다시 만들면 누름과 뗌 사이에 누른 단추가 교체되어
  // 브라우저가 click 을 만들지 않는다(G1.4-14-4-3).
  const wanted = browsing ? chromeButtons.slice(1) : chromeButtons;
  if (wanted.length !== chromeActs.children.length || wanted.some((button, index) => chromeActs.children[index] !== button)) {
    chromeActs.replaceChildren(...wanted);
  }
  chromeButtons[1].dataset.on = String(value("left"));
  chromeButtons[2].dataset.on = String(value("right"));
  const mode = modeName() === "dark" ? "sun" : "moon";
  if (chromeButtons[3].dataset.icon !== mode) {
    chromeButtons[3].innerHTML = icon(mode);
    chromeButtons[3].dataset.icon = mode;
  }
}

/* 크롬 단추: 프로젝트 목록, 좌측과 우측 사이드바 위치, 밝게/어둡게, 설정. 명령 인자는 누른 때의 값으로 계산한다. */
const chromeButtons = [
  act("projects", "프로젝트 목록", false, "core.projects.browse", {}, "core.chrome.projects"),
  act("panel-left", "좌측 사이드바 위치", value("left"), "core.settings.set", () => ({ patch: { left: !value("left") } }), "core.chrome.left"),
  act("panel-right", "우측 사이드바 위치", value("right"), "core.settings.set", () => ({ patch: { right: !value("right") } }), "core.chrome.right"),
  // 모달의 모드 세그먼트와 같은 경로다. 테마 명령은 테마의 형태 값까지 다시
  // 적용하므로, 그것을 부르면 사용자가 정한 통로와 모서리가 되돌아간다.
  act(modeName() === "dark" ? "sun" : "moon", "밝게 / 어둡게", false,
      "core.settings.set", () => ({ patch: { mode: modeName() === "dark" ? "light" : "dark" } }), "core.chrome.mode"),
  // 모달이 열린 동안에는 오버레이가 이 버튼을 덮으므로 다시 눌리지 않는다. 켜짐
  // 상태도 표시하지 않는다. 구 프로젝트의 settings-toggle 과 같다.
  act("settings", "설정", false, "core.settings.open", {}, "core.chrome.settings"),
];
chromeButtons[3].dataset.icon = modeName() === "dark" ? "sun" : "moon";

const library = createLibrary(document.getElementById("library"), coreChanged);
await installCoreExposure({
  library, renames,
  // 판의 그리기 순서. 배치를 바꾼 코어 명령은 이것을 기다린 뒤 답한다.
  drawn: async () => {
    await drawing;
    const ids = [...document.querySelectorAll("[data-native-surface-id]")]
      .map((slot) => slot.dataset.nativeSurfaceId);
    await Promise.all(ids.map((id) => waitSurfaceCompositionDeclared(id)));
  },
  chrome: () => ({
    controlsWidth: controlsAt ? controlsAt.x + controlsAt.w : 0,
    projectTabs: workarea.querySelector(".project-column") ? "left" : "top",
  }),
});
onDrag(coreChanged);
/* 키보드 단축키도 명령을 실행한다. */
addEventListener("keydown", (event) => {
  if (!(event.metaKey || event.ctrlKey)) return;
  if (!chrome && event.shiftKey && event.key.toLowerCase() === "n") { event.preventDefault(); return run("core.window.new"); }
  if (event.key.toLowerCase() === "k" && projects.inLibrary()) {
    event.preventDefault();
    return run("core.focus.set", { name: "core.library.search" });
  }
});
/* 판 밖의 프레임을 누르면 글자 크기의 범위는 프레임이다(docs/spec/text-size.md). */
addEventListener("pointerdown", (event) => {
  if (event.target.closest?.(".chrome-bar, .tabs--space, .tabs--project")) setTextScope({ kind: "frame" });
}, true);
/* 애플리케이션 메뉴의 글자 크기 항목은 이 명령들만 요청한다. 다른 이름은 오류로 알린다. */
const MENU_COMMANDS = ["core.text.larger", "core.text.smaller", "core.text.reset"];
onMenuCommand((name) => {
  if (!MENU_COMMANDS.includes(name)) {
    showError(`menu command is not allowed: ${String(name)}`);
    return;
  }
  Promise.resolve(run(name)).catch((error) => showError(`${name} failed: ${error.message}`));
});
/* 키보드 초점의 이동을 core.focus 로 알린다. */
addEventListener("focusin", coreChanged);
addEventListener("focusout", coreChanged);

const storage = await openStore();
await connectSettings(storage);
projects.onChange(() => { drawBars(); drawSettings(); library.refreshFolders(); library.render(); coreChanged(); });
await projects.initialise(storage);
drawBars();
// 앱이 다시 시작하거나 페이지가 실패한 뒤, 어떤 레이아웃에도 없는 표면의 사이드카 세션을 닫는다.
retainSidecarSessions(projects.layoutSurfaces()).catch(showError);

let geometrySave;
addEventListener("resize", () => {
  clearTimeout(geometrySave);
  geometrySave = setTimeout(() => projects.saveGeometry().catch(showError), 200);
});
if (!chrome) addEventListener("pagehide", () => { projects.flush().catch(showError); });

/* 합성 손잡이가 바뀌면 다시 그린다. 손잡이는 렌더에서 읽히므로 다시 그리지 않으면
   바꾼 값이 나타나지 않는다. */

/* 설정이 바뀌면 판과 크롬을 다시 그린다. 첫 프로젝트를 만든 뒤에 등록한다. 그 전에
   호출되면 그릴 프로젝트가 없다. */
onSettingsChange(() => {
  const half = halfGap();
  setGap(half);
  settle();
  drawBars();
  drawSettings();
  coreChanged();
});

/* 창 크기가 바뀌면 SoksakView 의 ResizeObserver 가 다시 그린다. 여기서 같은
   것을 관측하면 옵저버가 둘이 되고, 하나가 이전 크기로 배치한 뒤 다른 하나가 다시
   배치한다. */

</script>
</body></html>
