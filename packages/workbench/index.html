<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>soksak</title>
<link rel="icon" href="data:,">
<script type="importmap">
{"imports": {
  "soksak": "/modules/soksak/dist/index.js",
  "@soksak/plugin-api": "/modules/@soksak/plugin-api/index.js",
  "@soksak/plugin-api/page": "/modules/@soksak/plugin-api/page.js",
  "@soksak/plugin-api/screen-hash": "/modules/@soksak/plugin-api/screen-hash.js",
  "@soksak/runtime": "/runtime/index.js",
  "@soksak/shared/": "/shared/",
  "@soksak/workbench/": "/"
}}
</script>
<link rel="stylesheet" href="./app.css">
<link rel="stylesheet" href="./library.css">
<!-- This module draws the first screen before the first await. It is a render-blocking script in head, so the document is not drawn before its execution ends,
     and WebKit keeps the previous page of a reload on screen (docs/spec/native-host.md#page-start). The module runs after the document
     is fully read. -->
<script type="module" blocking="render">
/* environment.json is loaded first. The modules below read the registered plugins and the defaults
   at the time a function is called. */
import { pageStart } from "./page-start-errors-install.js";
import { defaultRegistry, installEnvironment, pluginUnits, starterPack } from "./environment.js";
import { appUpdate, onPluginOperations, pluginOperations } from "./installed-plugins.js";
import { installExposure } from "./exposure.js";
/* The declaration files and the installed list are imported as a module graph so that the first screen is drawn before the first await (docs/spec/native-host.md#page-start). */
import exposureFile from "./exposure.json" with { type: "json" };
import environmentFile from "./environment.json" with { type: "json" };
import installedPlugins from "./installed-plugins.json" with { type: "json" };
import { openStore, windows } from "@soksak/runtime";
/* The request that fetches the start document starts the page of this window (docs/spec/native-host.md#page-start). */
import start from "./runtime/start.js";

import { installTheme } from "soksak";

/* Values outside the plane belong to settings. This document recreates the plane when a value changes.
   If settings called the plane directly, a function to call would have to be chosen for each added setting. */
import {
  halfGap, install, modeName, onSettingsChange, value, connectSettings,
} from "./settings.js";

/* Simulates and reports the surfaces. The plane only records values on the slot elements, and measuring and reporting
   are done here. */
import { latest, onCommit, onRun, publish, publishAhead } from "./compositor.js";
import { authorizeSurface, disposeSurface, disposeSurfacesExcept, focusSurface, waitSurfaceCompositionDeclared } from "./surface-modules.js";
import { createMemorySaver } from "./memory-saver.js";
import { onTabReports, reportTitle, tabKeeps } from "./tab-reports.js";

/* One plane. This document does not know how the plane renders and only receives the render completion. */
import {
  currentGrid, onLayout, onRender, takeSurfaceFocus, setGap, settle, settleModifiedTabsToClose, tabsOf,
} from "./plane.js";

/* Reads the plane and the compositor and verifies them. It changes nothing, so those two do not
   know this module. */
import { verify } from "./verify.js";
/* Wiring of the error display and the layout queue. This document passes the document, the host, the plane and the compositor. */
import { createErrorDisplay, createPageLayout, reportUncaught } from "./page-layout.js";

/* Application interface. When it is absent, an implementation that does nothing is used. */
import { chrome, log, onMemoryPressure, onMenuCommand, retainSidecarSessions, surfaces as host } from "./host.js";
import { setTextScope } from "./text-size.js";
import { applyFrameText, chromeRow, drawnFrameText } from "./frame-text.js";

/* Public entries and diagnostic methods of the core. The registry answers requests of the host. */
import { coreChanged, installCoreExposure, setVerify } from "./core-exposure.js";
/* Only a diagnostic build contains the diagnostic methods. In other builds this is an empty module. */
import "./diagnostics.js";

/* Projects and the spaces inside them. The plane draws one space at a time, and a switch saves the current
   state and then applies another state. */
import * as projects from "./projects.js";
import * as registry from "./registry.js";

/* Settings modal. The registered plugins determine the list of places to connect sidebars. */
import { drawSettings } from "./settings-ui.js";
import { bind, run } from "./commands.js";
import { icon } from "./icons.js";
import { adopt, capture, clear, onDrag } from "./plane.js";
import { checkStoredLayout } from "./stored-layout.js";
import { onChoicesChange } from "./sidebar-sections.js";

import { createLibrary } from "./library.js";

/* Error banner of the main document. An unhandled error is also shown in this banner and sent to the application log (page-layout.js). It is installed before anything else
   so that an error that stops the start is shown too. */
const showError = createErrorDisplay({ document, changed: coreChanged });
reportUncaught(globalThis, showError);
/* Right end (px) of the window button area read last. The first row leaves that much empty. The window button area of the start
   document is applied first so that the first row does not cover the window buttons even when the start stops. */
let controlsWidth = 0;
if (chrome) applyControls(start.controls);

installExposure(exposureFile);
// When the manifest of an installed plugin is rejected, the page cannot start. The error is shown and the start stops here. The reload
// is done by host.window.reload (docs/spec/installation.md).
try {
  installEnvironment(environmentFile, installedPlugins);
} catch (error) {
  showError(error.message);
  await new Promise(() => {});
}

// This sheet defines the shape of the line and the divider. This document specifies only the colors, and :root below
// connects those tokens to the colors of this document.
installTheme(document);

/* Sets the setting values on the document root. The stylesheet reads them. */
install();


/* Wiring */

/**
 * Runs the verification and records only when the result has changed.
 *
 * The verification runs on every render. Recording every time would repeat the same line, and the time of a change could not be known.
 *
 * Equality is judged only within one run. One application drives the boundary several times,
 * and judging over its whole life would leave the result nowhere from the second run on.
 */
let lastSaid = "";

onRun((going) => {
  if (going) lastSaid = "";
});

function check() {
  if (!currentGrid() || projects.inLibrary()) return;
  controlsAt = presentedControls();
  const rows = verify(controlsAt);
  const layoutFailure = pageLayout.failure();
  if (layoutFailure) rows.push({ name: "Surface presentation", ok: false, note: layoutFailure.message });
  setVerify(rows);
  const failed = rows.filter((r) => !r.ok);
  const line = failed.length === 0
    ? `verify: ${rows.length} pass`
    : `verify: ${failed.length} fail — ` +
      failed.map((r) => `${r.name} (${r.note})`).join(" · ");
  if (line === lastSaid) return;
  lastSaid = line;
  // The application writes to its own log. Without a host it goes to the console only. A pass is an observation and a failure is an error.
  if (failed.length === 0) log(line);
  else host.report(line);
}

/* Places where no surface stands. A sleeping surface has no size. */
const NOWHERE = { x: 0, y: 0, w: 0, h: 0 };

/**
 * Surfaces of the tabs that are not drawn now.
 *
 * There is one surface per tab, and the only visible one is the active tab of a drawn card. The others
 * must be declared too for the host to keep them alive, so that the shell and the page stay as they are when moving across spaces or projects.
 * Without the declaration, the host treats them as surfaces without an owner and removes them.
 */
function dormant(shown) {
  const seen = new Set(shown.map((s) => s.id));
  const out = [];
  const add = (tab) => {
    // A tab of a plugin that is not loaded has no surface, only a placeholder (docs/spec/plugins.md).
    if (seen.has(tab.id) || !registry.hasPlugin(tab.plugin)) return;
    seen.add(tab.id);
    out.push({
      id: tab.id, plugin: tab.plugin, layer: 0,
      declared: NOWHERE, applied: NOWHERE, visible: false, dim: false,
      surface: registry.plugin(tab.plugin).surface(tab.id),
    });
  };
  // Tabs of the current plane. Those that are not the active tab are collected here.
  for (const card of currentGrid()?.cards ?? []) for (const t of tabsOf(card)) add(t);
  // Tabs of the other spaces. For the active space, the plane above is correct, not the stored layout.
  const here = projects.active();
  for (const p of projects.local()) {
    for (const space of p.spaces) {
      if (!projects.inLibrary() && p === here && space.id === here.activeSpaceId) continue;
      for (const card of space.layout.state.cards) {
        for (const t of card.data?.tabs ?? []) add(t);
      }
    }
  }
  return out;
}

/* Reports the surfaces to the host when the commit ends. The compositor knows only the surfaces of this plane, and this
   document knows what must stay alive. The reply of the host is returned as it is. */
/* The memory saver (docs/spec/plugins.md#memory-saver). It observes the commits once the tab state store is open, because
   its mark kept and the label cache of a tab that starts unloaded live in that store. */
const memorySaver = createMemorySaver({
  now: () => performance.now(),
  enabled: () => value("memorySaver"),
  delay: () => value("memorySaverDelay"),
  declaration: (id) => {
    if (registry.plugin(id).background) return "background";
    // default: a plugin that is not loaded declares no surface.unload.
    return pluginUnits().find((unit) => unit.id === id)?.unload ? "unload" : "undeclared";
  },
  keeps: tabKeeps,
  kept: (tab) => projects.tabStateStore()?.entry(tab)?.kept === true,
  // The region query and the interactionState read arrive with the document region reports (F198.5); without the query
  // the memory saver treats every hidden tab as media-unknown, and a read that yields nothing restores without history.
  interaction: async () => undefined,
  commit: () => Promise.resolve(publish()),
  showLabel: (tab) => {
    const label = projects.tabStateStore()?.label(tab) ?? null;
    if (label !== null) reportTitle(tab, label);
  },
});
let memoryObserved = false;
onTabReports(() => memorySaver.protectionsChanged());
onMemoryPressure((report) => memorySaver.pressure(report));

/** Gives the memory saver the shown tabs and every layout tab of a loaded plugin of a commit. */
function observeMemory(record, all) {
  if (!memoryObserved) return;
  memorySaver.observe(new Set(record.surfaces.map((surface) => surface.id)),
    all.map((surface) => ({ id: surface.id, plugin: surface.plugin })));
}

onCommit((record) => {
  const candidates = [...record.surfaces, ...dormant(record.surfaces)];
  observeMemory(record, candidates);
  // An unloaded tab stays in the layout: it is not declared to the host, its surface is released in the unload mode, and
  // it is retained so that it is not released as a closed tab.
  const { surfaces: all, retain: ids, unload } = memorySaver.place(candidates);
  // A tab of a plugin that is not loaded is not a surface, but its placeholder must stay alive (docs/spec/plugins.md).
  for (const card of currentGrid()?.cards ?? []) {
    for (const tab of tabsOf(card)) if (!registry.hasPlugin(tab.plugin)) ids.add(tab.id);
  }
  return Promise.all(unload.map((id) => disposeSurface(id, { mode: "unload" }))).then(() => disposeSurfacesExcept(ids)).then(() => {
    const placed = host.place({ ...record, surfaces: all });
    return Promise.resolve(placed).then((answer) => {
      for (const surface of record.surfaces) authorizeSurface(surface.id);
      return answer;
    });
  });
});

/* When the plane is redrawn, it is verified and the surfaces are reported. The plane does not know the two and the two only read the plane,
   so they are connected in this document. */
let presented = Promise.resolve();
onRender(() => {
  const done = publish();
  presented = Promise.resolve(done);
  const record = latest();
  presented = presented.then(() => {
    if (latest() !== record) return false;
    pageLayout.clearFailure();
    check();
    coreChanged();
    if (record?.settled !== false) {
      projects.keep();
      pageLayout.reportSuperseded();
    }
    return true;
  }).then(async () => {
    if (latest() !== record) return;
    const surfaceId = takeSurfaceFocus();
    if (surfaceId) await focusSurface(surfaceId);
  });
});

/* Layout queue. It marks the layout of the plane, the first row of a window without a plane, and the empty plane of a project switch, one by one. */
const pageLayout = createPageLayout({
  document, showError, setVerify, log, surfaces: host,
  plane: { currentGrid, settle, clear },
  compositor: { publishAhead, publish },
  textSize: () => value("textSize"),
  rendered: () => presented,
  waitSurfaceCompositionDeclared,
});
// The tab selection and collapse of a sidebar are stored in the space (docs/spec/projects.md#persistence).
onChoicesChange(() => projects.keep());

/* When the space changes, the current plane is saved and another state is applied. A project switch is the same
   operation. */
projects.onSwitch({ check: checkStoredLayout, save: capture, load: adopt, update: settle,
// Clears the surface modules of tabs that are in no layout. The placeholder of a plugin that is not loaded disappears with its tab.
retain: (surfaceIds) => disposeSurfacesExcept(surfaceIds),
presented: pageLayout.presented, empty: pageLayout.empty, settleTabs: settleModifiedTabsToClose });


/* Project and space rows
   A project switch replaces the whole space list, and a space switch replaces the whole layout of the plane.
   They are the same operation, so there is one path.                                */

const projectBar = document.getElementById("projectBar");
const workarea = document.getElementById("workarea");
const spaceBar = document.getElementById("spaceBar");
const chromeActs = document.getElementById("chromeActs");

/* The area that drags the window, and the area that the buttons drawn by the window occupy.

   The OS draws the buttons. Only the title bar is transparent and the content occupies the whole window, so those
   buttons are placed over this bar. Their width is requested from the host, and the left side of the bar
   is left empty by that width.

   The height of the window title bar is carried by the layout preparation, and the host sets it in that transaction (docs/spec/native-surfaces.md#title-bar-height).
   Verification W compares the button area (controlsAt) of the preparation whose display was confirmed with the drawn first row.

   A browser has no window. Then chrome is null and the bar is not indented. */
let controlsAt = null;

if (chrome) {
  chrome.draggable(document.getElementById("winDrag"));
  // When the window size changes, the OS places the buttons again, so that area is read again. For a window that left full screen, the title bar height that AppKit
  // restored is reported here.
  addEventListener("resize", askControls);
}

/** Reads the window button area, sets the indent of the first row, and prepares the first row again when the title bar differs from the first row. */
function askControls() {
  chrome.controls().then((answer) => {
    applyControls(answer);
    fitTitlebar(answer);
  });
}

/** Sets the indent of the first row from the window button reply. When the reply has no buttons, nothing is set. */
function applyControls(answer) {
  const at = answer.controls;
  if (at.w <= 0) return;
  controlsWidth = at.x + at.w;
  document.documentElement.style.setProperty("--controls-w", `${controlsWidth}px`);
}

/**
 * When the reply has a title bar (row > 0) and its height differs from the first row at the current scale, the window changed the title bar without a draw of the page
 * (40pt when the window is created, the height that AppKit restores when leaving full screen). Then the last request is forgotten and a layout containing the first row is
 * prepared again. The page sets the row height and does not read it from the window reply.
 */
function fitTitlebar(answer) {
  if (answer.row > 0 && answer.row !== chromeRow(value("textSize"))) {
    host.forget();
    pageLayout.drawFrame();
  }
}

/** Window button area of the preparation whose display was confirmed. It is null for a window without a title bar (full screen) or a window that draws no buttons. */
function presentedControls() {
  const committed = chrome?.presented();
  return committed && committed.row > 0 && committed.controls.w > 0 ? committed.controls : null;
}

/** Creates one icon button of the chrome row. When pressed, it runs command with params. */
function act(name, title, on, command, params, expose) {
  const b = document.createElement("button");
  b.className = "act";
  b.dataset.expose = expose;
  b.type = "button";
  b.title = title;
  b.dataset.on = String(on);
  b.innerHTML = icon(name);
  bind(b, command, params);
  return b;
}

/**
 * Creates one tab. A click switches, a double click renames, and ✕ closes. All three are commands.
 *
 *   pick    {command, params}
 *   close   {command, params} or none
 *   rename  {kind, id} or none
 */
function tab(text, on, { dot, pick, close, rename, expose, closeExpose }) {
  if (rename && renaming?.kind === rename.kind && renaming.id === rename.id) return renameField(text);
  const el = document.createElement("button");
  el.className = "bar-tab";
  el.dataset.expose = expose;
  el.type = "button";
  el.dataset.on = String(on);
  el.title = text;
  // The project color is shown as the background of the selected tab. No separate mark is used.
  if (dot && on) el.style.background = `color-mix(in srgb, ${dot} 24%, transparent)`;
  const name = document.createElement("span");
  name.className = "bar-tab__name";
  name.textContent = text;
  el.appendChild(name);
  bind(el, pick.command, pick.params);
  if (rename) {
    el.dataset.rename = JSON.stringify(rename);
    el.addEventListener("dblclick", () => run("core.rename.begin", rename));
  }
  if (close) {
    const x = document.createElement("span");
    x.className = "bar-tab__x";
    x.dataset.expose = closeExpose;
    x.setAttribute("role", "button");
    x.textContent = "✕";
    bind(x, close.command, close.params, { stop: true });
    el.appendChild(x);
  }
  return el;
}

/* Rename in progress. {kind: "project"|"space", id, value}. */
let renaming = null;

/** Input field in the place of the tab being renamed. Enter confirms, Escape cancels, and losing focus confirms. */
function renameField(was) {
  const input = document.createElement("input");
  input.className = "bar-tab__root";
  input.dataset.expose = "core.rename.input";
  input.value = renaming.value ?? was;
  // The entered value is recorded with core.rename.set. The confirmation uses that value.
  bind(input, "core.rename.set", () => ({ value: input.value }), { event: "input" });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") return run("core.rename.commit");
    if (e.key === "Escape") return run("core.rename.cancel");
  });
  input.addEventListener("focusout", () => { if (renaming) return run("core.rename.commit"); });
  queueMicrotask(() => { if (input.isConnected) { input.focus(); input.select(); } });
  return input;
}

/** Operations that the rename commands call. */
const renames = {
  begin({ kind, id }) {
    const list = kind === "project" ? projects.all() : kind === "space" ? projects.active()?.spaces ?? [] : null;
    if (!list) throw new Error(`unknown rename target ${kind}`);
    const found = list.find((item) => item.id === id);
    if (!found) throw new Error(`no ${kind} ${id}`);
    renaming = { kind, id, value: found.title };
    drawBars();
    coreChanged();
  },
  set(value) {
    if (!renaming) throw new Error("nothing is being renamed");
    renaming.value = String(value);
    coreChanged();
  },
  async commit() {
    if (!renaming) throw new Error("nothing is being renamed");
    const { kind, id, value } = renaming;
    renaming = null;
    const title = value.trim();
    if (title) {
      if (kind === "project") await projects.rename(id, title);
      else projects.renameSpace(id, title);
    }
    drawBars();
    coreChanged();
  },
  cancel() {
    if (!renaming) throw new Error("nothing is being renamed");
    renaming = null;
    drawBars();
    coreChanged();
  },
  state: () => renaming && { ...renaming },
};

/** Creates the "+" button. */
function addTabButton(text, command, expose) {
  const b = document.createElement("button");
  b.className = "bar-tab bar-tab--add";
  b.dataset.expose = expose;
  b.type = "button";
  b.textContent = text;
  bind(b, command);
  return b;
}

function drawBars() {
  const here = projects.active();
  const browsing = projects.inLibrary();
  document.body.dataset.screen = browsing ? "library" : "workspace";
  const toLeft = !browsing && value("projectTabs") === "left";
  /* The project column is created only in the left mode. It is removed, not hidden. [hidden] does not override the rule that
     sets display and .project-column is display:flex, so hiding it would leave an empty
     area. The chrome row, in contrast, is always kept. Even when empty, that row pushes the buttons
     to the right. */
  let column = workarea.querySelector(".project-column");
  if (toLeft && !column) {
    column = document.createElement("div");
    column.className = "project-column";
    column.dataset.expose = "core.projects.column";
    workarea.prepend(column);
  } else if (!toLeft && column) {
    column.remove();
    column = null;
  }
  const into = toLeft ? column : projectBar;
  projectBar.textContent = "";
  if (column) column.textContent = "";

  for (const p of browsing ? [] : projects.all()) {
    const el = tab(p.title, p.id === here?.id, {
      dot: p.color,
      expose: "core.project-tab",
      closeExpose: "core.project-tab.close",
      pick: { command: "core.project.activate", params: { id: p.id } },
      rename: { kind: "project", id: p.id },
      close: { command: "core.project.close", params: { id: p.id } },
    });
    // The reorder by drag and drop is made by core.project.move.
    if (el.tagName === "BUTTON") {
      el.draggable = true;
      el.addEventListener("dragstart", (e) => e.dataTransfer.setData("text/plain", p.id));
      el.addEventListener("dragover", (e) => e.preventDefault());
      el.addEventListener("drop", (e) => {
        e.preventDefault();
        const ids = projects.all().map((p) => p.id);
        const from = ids.indexOf(e.dataTransfer.getData("text/plain"));
        if (from >= 0) return run("core.project.move", { id: ids[from], delta: ids.indexOf(p.id) - from });
      });
    }
    into.appendChild(el);
  }
  if (!browsing) into.appendChild(addTabButton("+", "core.projects.browse", "core.project-tab.add"));

  spaceBar.textContent = "";
  for (const sp of here?.spaces ?? []) {
    spaceBar.appendChild(tab(sp.title, sp.id === here.activeSpaceId, {
      expose: "core.space-tab",
      closeExpose: "core.space-tab.close",
      pick: { command: "core.space.activate", params: { id: sp.id } },
      rename: { kind: "space", id: sp.id },
      close: here.spaces.length > 1 ? { command: "core.space.close", params: { id: sp.id } } : null,
    }));
  }
  if (here) spaceBar.appendChild(addTabButton("+", "core.space.add", "core.space-tab.add"));

  // The chrome buttons keep an element once created and fix only the changed attributes. Recreating one would replace the pressed button between press and release, so
  // the browser would not produce a click (G1.4-14-4-3).
  // The library screen has no layout, so the project list and auto-arrange buttons are left out there.
  const updates = pluginOperations.status().updates.length + (appUpdate.status().available ? 1 : 0);
  if (updates > 0 && updatesButton.textContent !== `업데이트 ${updates}`) updatesButton.textContent = `업데이트 ${updates}`;
  const base = browsing ? chromeButtons.slice(2) : chromeButtons;
  const wanted = updates > 0 ? [updatesButton, ...base] : base;
  if (wanted.length !== chromeActs.children.length || wanted.some((button, index) => chromeActs.children[index] !== button)) {
    chromeActs.replaceChildren(...wanted);
  }
  chromeButtons[2].dataset.on = String(value("left"));
  chromeButtons[3].dataset.on = String(value("right"));
  const mode = modeName() === "dark" ? "sun" : "moon";
  if (chromeButtons[4].dataset.icon !== mode) {
    chromeButtons[4].innerHTML = icon(mode);
    chromeButtons[4].dataset.icon = mode;
  }
}

/* Chrome buttons: project list, card auto-arrange, left and right sidebar position, light/dark, settings. The command arguments are computed from
   the values at the time of the press. */
const chromeButtons = [
  act("projects", "프로젝트 목록", false, "core.projects.browse", {}, "core.chrome.projects"),
  // Keeps the layout and gives the cards a fair share (packages/soksak/docs/layout.md#balancing).
  act("columns-3", "카드 자동 정렬", false, "core.layout.balance", {}, "core.chrome.balance"),
  act("panel-left", "좌측 사이드바 위치", value("left"), "core.settings.set", () => ({ patch: { left: !value("left") } }), "core.chrome.left"),
  act("panel-right", "우측 사이드바 위치", value("right"), "core.settings.set", () => ({ patch: { right: !value("right") } }), "core.chrome.right"),
  // The same path as the mode segment of the modal. The theme command also applies the shape values of the theme
  // again, so calling it would revert the passage and corners that the user set.
  act(modeName() === "dark" ? "sun" : "moon", "밝게 / 어둡게", false,
      "core.settings.set", () => ({ patch: { mode: modeName() === "dark" ? "light" : "dark" } }), "core.chrome.mode"),
  // While the modal is open, the overlay covers this button, so it cannot be pressed again. The on
  // state is not shown either. This is the same as settings-toggle of the former project.
  act("settings", "설정", false, "core.settings.open", {}, "core.chrome.settings"),
];
chromeButtons[4].dataset.icon = modeName() === "dark" ? "sun" : "moon";

/* The update control with the count N is in the bar only while the registry lists an update (docs/spec/installation.md). */
const updatesButton = document.createElement("button");
updatesButton.className = "act act--text";
updatesButton.dataset.expose = "core.chrome.updates";
updatesButton.type = "button";
updatesButton.title = "플러그인 업데이트 목록";
bind(updatesButton, "core.plugins.show-updates", {});
onPluginOperations(() => drawBars());

const library = createLibrary(document.getElementById("library"), coreChanged);

/* First screen. The start document applies the button margin and the settings, and the plane of the project that the window opens or the library is drawn before the first await.
   WebKit keeps the previous page of a reload on screen until the new page first draws visible content, so the first frame is
   this screen (docs/spec/native-host.md#page-start). The layout queue is connected after it so that the first draw of the plane does not wait for
   the native preparation. The plugin content and the native surfaces are filled in afterwards. */
projects.onChange(() => { drawBars(); drawSettings(); library.refreshFolders(); library.render(); coreChanged(); });
projects.begin(start.workspace);
// The first draw of the plane writes the frame scale to the document. The first screen without a plane (library) has no such draw, so it is written here.
applyFrameText(value("textSize"));
onLayout(pageLayout.onLayout);
// The host creates the window with a 40pt title bar. When the first row differs, a layout containing the first row is prepared.
if (chrome) fitTitlebar(start.controls);
// The first screen is drawn, so the start error handler ends and the error display of this document takes the later errors.
pageStart.finish();

// The core public entries are registered before the first await. The sidebar sections of the first screen are mounted asynchronously after that and can follow the core state
// (docs/spec/plugins.md#sections). The connection with the host is awaited below.
const coreExposure = installCoreExposure({
  library, renames,
  // Draw order of the plane. A core command that changed the layout replies after awaiting this (page-layout.js).
  drawn: pageLayout.drawn,
  chrome: () => ({
    controlsWidth,
    projectTabs: workarea.querySelector(".project-column") ? "left" : "top",
  }),
});
// The reason for the placeholder of a tab of a plugin that is not loaded is set by the installation state (docs/spec/plugins.md). When the state is read,
// the placeholder is drawn again. A read failure is left as an error of that state.
await pluginOperations.refresh();
await pluginOperations.refreshOutdated();
await appUpdate.refresh();
// On the first run, the starter pack is installed and the page is reloaded to load the installed plugins (docs/spec/installation.md).
// While reloading, this page does not create a space.
if (await pluginOperations.installStarter(starterPack(), defaultRegistry(), log, showError)) {
  location.reload();
  await new Promise(() => {});
}
await coreExposure;
onDrag(coreChanged);
/* Keyboard shortcuts also run commands. */
addEventListener("keydown", (event) => {
  if (!(event.metaKey || event.ctrlKey)) return;
  if (!chrome && event.shiftKey && event.key.toLowerCase() === "n") { event.preventDefault(); return run("core.window.new"); }
  if (event.key.toLowerCase() === "k" && projects.inLibrary()) {
    event.preventDefault();
    // Goes to the search field of the visible page of the library.
    return run("core.focus.set", { name: library.state().page === "plugins" ? "core.library.plugins.search" : "core.library.search" });
  }
});
/* When a frame outside the plane is pressed, the scope of the text size is the frame (docs/spec/text-size.md). */
addEventListener("pointerdown", (event) => {
  if (event.target.closest?.(".chrome-bar, .tabs--space, .tabs--project")) setTextScope({ kind: "frame" });
}, true);
/* The text size items of the application menu and the Debug item of Help request only these commands. Another name is reported as an error. */
const MENU_COMMANDS = ["core.text.larger", "core.text.smaller", "core.text.reset", "core.debug.open"];
onMenuCommand((name) => {
  if (!MENU_COMMANDS.includes(name)) {
    showError(`menu command is not allowed: ${String(name)}`);
    return;
  }
  Promise.resolve(run(name)).catch((error) => showError(`${name} failed: ${error.message}`));
});
/* Reports the move of the keyboard focus with core.focus. */
addEventListener("focusin", coreChanged);
addEventListener("focusout", coreChanged);

const storage = await openStore();
await connectSettings(storage);
// default: a plugin that is not loaded declares no surface.unload.
await projects.initialise(storage, (plugin) => pluginUnits().find((unit) => unit.id === plugin)?.unload ?? false);
memoryObserved = true;
// default: before the first commit there is no record, and the next commit gives the tabs.
if (latest()) observeMemory(latest(), [...latest().surfaces, ...dormant(latest().surfaces)]);
memorySaver.start();
drawBars();
// After the application restarts or the page fails, closes the sidecar sessions of surfaces that are in no layout.
retainSidecarSessions(projects.layoutSurfaces()).catch(showError);

let geometrySave;
addEventListener("resize", () => {
  clearTimeout(geometrySave);
  geometrySave = setTimeout(() => projects.saveGeometry().catch(showError), 200);
});
if (!chrome) addEventListener("pagehide", () => { projects.flush().catch(showError); });

/* Redraws when a composition handle changes. The handle is read in the render, so without a redraw
   the changed value would not appear. */

/* When a setting changes, the plane and the chrome are redrawn. This is registered after the first project is created. If it were called
   earlier, there would be no project to draw. */
onSettingsChange(() => {
  const half = halfGap();
  setGap(half);
  // A window without a plane redraws the first row only when the frame scale changes. The plane is redrawn on every setting change.
  if (currentGrid() || drawnFrameText() !== value("textSize")) pageLayout.drawFrame();
  drawBars();
  drawSettings();
  coreChanged();
  memorySaver.settingsChanged();
});

/* When the window size changes, the ResizeObserver of SoksakView redraws. Observing the same
   thing here would make two observers, and after one lays out with the previous size the other would
   lay out again. */

</script>
</head>
<body data-screen="library">
<section id="library" aria-label="프로젝트 라이브러리"></section>



<!-- Window chrome. The brand, the project tabs and the frequently used switches.
     Depending on the settings, the project tabs stand here or go to the vertical rail on the left. -->
<header class="chrome-bar" data-expose="core.chrome.bar">
  <!-- The area that drags the window. It covers all the empty space of the bar, and the buttons and tabs are placed above it.
       If the bar itself were marked, the mark would be inherited by the children and the window
       would move even when a button is pressed. -->
  <div class="chrome-bar__drag" id="winDrag"></div>
  <!-- soksak logo. The color of the icon tile is fixed, and the letters follow the .brand color of app.css by mode. -->
  <div class="brand" data-expose="core.brand" role="img" aria-label="soksak">
    <svg class="brand__logo" viewBox="0 0 323 80" aria-hidden="true">
      <svg x="0" y="0" width="80" height="80" viewBox="0 0 128 128"><rect x="1" y="1" width="126" height="126" rx="27" fill="#16181D" stroke="#33373F" stroke-width="2"/><path d="M26 37 L56 64 M53 61.3 L26 91" fill="none" stroke="#7FE3B8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="87" width="38" height="10" rx="5" fill="#EDE6D8"/></svg>
      <svg x="102" y="19.375" width="221.25" height="41.25" viewBox="-1 15 236 44"><g fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M27 25 C24 20.5 19 19 15 19 C8 19 4 22.5 4 27.5 C4 33 10 35 15.5 36 C21.5 37 28 39 28 46 C28 52 22.5 55 16 55 C10.5 55 6 53 3 49"/><circle cx="56" cy="37" r="18"/><path d="M88 19 V55 M108 19 L88 37 M88 37 L110 55"/><path transform="translate(120,0)" d="M27 25 C24 20.5 19 19 15 19 C8 19 4 22.5 4 27.5 C4 33 10 35 15.5 36 C21.5 37 28 39 28 46 C28 52 22.5 55 16 55 C10.5 55 6 53 3 49"/><circle cx="174" cy="37" r="18"/><path d="M192 19 V55"/><path d="M208 19 V55 M228 19 L208 37 M208 37 L230 55"/></g></svg>
    </svg>
  </div>
  <div class="tabs tabs--project" id="projectBar"></div>
  <div class="chrome-bar__acts" id="chromeActs"></div>
</header>

<!-- When the project tabs stand on the left, the rail is created at the first place inside this. It starts above the space row
     and goes down to the bottom, because a project contains spaces. -->
<div class="workarea" id="workarea">
  <div class="work">
  <!-- Space row. The planes inside one project. -->
  <div class="tabs tabs--space" id="spaceBar"></div>

<main class="stage"><div class="plane" id="plane">
  <svg class="rail" id="rail"><path id="railPath"></path></svg>
  <div class="drop" id="drop" data-expose="core.drop" hidden></div>
  <div class="picker" id="picker" data-native-modal="menu" hidden></div>
  <div class="focus-mark" id="focusMark" hidden></div>
</div></main>
  </div>
</div>

<!-- Every application uses the same document. The runtime differences are handled by @soksak/runtime, and
     the plugins and defaults are set by environment.json. -->
<script src="./background.js"></script>
<script type="module" src="./host.js"></script>

</body></html>
