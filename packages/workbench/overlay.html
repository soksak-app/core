<!doctype html>
<meta charset="utf-8">
<title>native modal</title>
<!--
  Renders one [data-native-modal] element of the main page.

  The DOM cannot be drawn over a native view, and a web view is a native view that renders the DOM. This
  page is loaded in a separate native web view inside the main window, so it is drawn over the surfaces
  and the surfaces keep running.

  It receives the class name and markup of the element and the stylesheet of the page. A click on an element with data-key
  is reported to the main page.
-->
<style>
  /* 스크립트보다 먼저 적용되도록 마크업에 둔다. 웹뷰는 자기 문서를 그리기 전까지
     흰색을 표시한다. */
  html, body { margin: 0; padding: 0; height: 100%; background: transparent }
  html { overflow: hidden }
</style>
<script type="importmap">
{"imports": {
  "soksak": "/modules/soksak/dist/index.js",
  "@soksak/plugin-api": "/modules/@soksak/plugin-api/index.js",
  "@soksak/plugin-api/bounded-json.js": "/modules/@soksak/plugin-api/bounded-json.js",
  "@soksak/plugin-api/log-batch.js": "/modules/@soksak/plugin-api/log-batch.js",
  "@soksak/plugin-api/page": "/modules/@soksak/plugin-api/page.js",
  "@soksak/plugin-api/screen-hash": "/modules/@soksak/plugin-api/screen-hash.js",
  "@soksak/runtime": "/runtime/index.js",
  "@soksak/shared/": "/shared/",
  "@soksak/workbench/": "/"
}}
</script>
<script type="module">
  import { followTheme, page } from "@soksak/plugin-api/page";
  import { onAnswer, onGripDrag, showValue } from "./card.js";
  import { modalOrder } from "./modal-order.js";
  import { restoreScroll, scrollPositions } from "./scroll-keep.js";
  import { updateContent } from "./overlay-content.js";

  followTheme().then(report);

  const id = new URLSearchParams(location.search).get("id");
  const instance = Number(new URLSearchParams(location.search).get("instance"));
  let sheet = null;
  let root = null;
  let pendingCard = null;
  // Whether the first content response was processed. It is true even when the response was discarded.
  let loaded = false;

  function place({ x, y, w, h }) {
    if (!root) { pendingCard = { x, y, w, h }; return; }
    root.style.left = `${x}px`;
    root.style.top = `${y}px`;
    root.style.width = `${w}px`;
    root.style.height = `${h}px`;
    report();
  }

  /* Reports the state of this document to the main page. The main page exposes it as core.modal
     (docs/spec/exposure.md). Before the render there is no element to report. */
  function report() {
    if (!root) return;
    const r = root.getBoundingClientRect();
    page.modal.answer(id, instance, "document", JSON.stringify({
      mode: root.dataset.nativeModal,
      filter: getComputedStyle(document.documentElement).filter,
      htmlBackground: getComputedStyle(document.documentElement).backgroundColor,
      bodyBackground: getComputedStyle(document.body).backgroundColor,
      scrimBackground: getComputedStyle(document.body, "::before").backgroundColor,
      rect: { x: r.left, y: r.top, width: r.width, height: r.height },
      loaded,
    }));
  }
  new MutationObserver(report).observe(document.documentElement, { attributes: true, attributeFilter: ["style", "class"] });

  function render({ mode, title, css, className, html, border }, card) {
    if (!sheet) {
      document.head.insertAdjacentHTML("beforeend", `<style id="page"></style>`);
      sheet = document.getElementById("page");
      // The stylesheet of the page arrives whole, including the body rules. This block is put after it
      // so that it takes precedence.
      document.head.insertAdjacentHTML("beforeend", `<style>
        html, body { margin: 0; padding: 0; height: 100%; background: transparent !important }
        /* 복사한 workbench 시트의 body::before 배경은 메인 문서 전용이다. 네이티브
           모달 문서에서는 backing을 가리지 않도록 제거한다. 메인 문서의 native paint clip 은
           메인 문서가 복사에서 뺀다(docs/spec/native-modals.md). */
        body::before {
          background: transparent !important
        }
        body[data-mode="dialog"]::before {
          content: ""; position: fixed; inset: 0; z-index: 0;
          background: rgb(0 0 0 / .5) !important; pointer-events: auto
        }
        body > [data-native-modal] { position: absolute; transform: none !important;
          z-index: 1; margin: 0 !important; max-height: none !important }
      </style>`);
      root = document.createElement("div");
      document.body.appendChild(root);
    }
    sheet.textContent = css;
    root.className = className;
    root.dataset.nativeModal = mode;
    document.body.dataset.mode = mode;
    document.title = title;
    root.setAttribute("role", "dialog");
    root.setAttribute("aria-modal", String(mode === "dialog"));
    root.setAttribute("aria-label", title);
    // When the same content is drawn again, its scroll position is kept. Other content has a different data-scroll-key and starts at the top.
    const positions = scrollPositions(root);
    updateContent(root, html);
    root.style.borderColor = border;
    // When there is no new position, the position already applied is kept.
    const at = card ?? pendingCard;
    pendingCard = null;
    if (at) place(at);
    else report();
    // The position must be restored after the card size is applied, so that the scroll range is not clipped to the previous size.
    restoreScroll(root, positions);
    reportScroll();

    // The view was created with the size that the main page measured, so there is nothing to measure here. This call
    // only reports that the content was rendered, and that is the time when the view can be shown.
    page.modal.ready(id, instance);
  }

  /* Called once at load and then every time the content changes. Recreating the view makes it flicker. The first content
     comes as the response of a call, so it can arrive later than a position that changed later. A stale value is discarded by the change
     number that the host attaches. */
  const order = modalOrder(render, place);
  page.modal.content(id, instance, order.content, order.position).then(() => {
    loaded = true;
    report();
  });

  /* The response is one (key, value). The same way of collecting it as in the main document is used. */
  const send = (key, value) => page.modal.answer(id, instance, key, value);

  /* Reports the scroll position of the visible content (data-scroll-key) to the page that owns the content (docs/spec/settings.md). Content
     without that element (a menu) is not reported. */
  function reportScroll() {
    const keyed = root?.querySelector("[data-scroll-key]");
    if (keyed) send("scroll", String(keyed.scrollTop));
  }
  document.addEventListener("scroll", (event) => {
    if (event.target instanceof Element && event.target.matches("[data-scroll-key]")) reportScroll();
  }, true);

  onAnswer(document, send);

  /* A grip drag is also sent through the same response. This view does not know the position of the card, so it passes only the move
     distance and the page that owns the card decides the position. */
  onGripDrag(document, (dx, dy) => send("move", `${dx},${dy}`));
  showValue(document);
</script>
