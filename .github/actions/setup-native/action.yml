name: Validate the runner native toolchain
description: Verify that the pinned runner provides the native compiler, SDK, CMake, and pkg-config tools.
inputs:
  root:
    description: Workspace root relative to the checkout.
    required: false
    default: core
runs:
  using: composite
  steps:
    - name: Validate native build tools supplied by the runner
      shell: bash
      run: |
        set -euo pipefail
        for tool in cc clang cmake pkg-config; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "required runner tool is unavailable: $tool" >&2
            exit 1
          fi
        done
        case "$(uname -s)" in
          Darwin)
            xcode-select -p
            xcrun --sdk macosx --show-sdk-path
            clang --version
            ;;
          Linux)
            cc --version
            clang --version
            ;;
          *) echo "unsupported native runner operating system: $(uname -s)" >&2; exit 1 ;;
        esac
        cmake --version
        pkg-config --version
