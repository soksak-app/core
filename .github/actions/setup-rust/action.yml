name: Set up the workspace Rust toolchain
description: Install the fixed Rust compiler and the formatting and lint components.
inputs:
  root:
    description: Workspace root relative to the checkout.
    required: false
    default: core
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
      with:
        toolchain: 1.98.0
        components: clippy, rustfmt
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        workspaces: ${{ inputs.root }} -> target
