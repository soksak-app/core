name: virtual-display-measure
# build-machine: skip smoke reason=a measurement that runs on request on a hosted runner (F239-303-9)
# Measures whether a virtual display gives the hosted runner what the native presentation tests and the window checks need
# (F239-303-9, F160.29). It runs on request, because its result decides where those checks run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  presentation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch pinned native release file
        run: make -C core native-darwin-fetch
      - name: Build the native library offline
        env:
          OFFLINE: '1'
        run: make -C core native-darwin
      - name: Build the virtual display program
        run: make -C core/native/darwin "$GITHUB_WORKSPACE/core/native/darwin/build/virtual_display"
      - name: Presentation tests on a virtual display
        env:
          SOKSAK_NATIVE_TEST_RUN_FOLDER: ${{ runner.temp }}/soksak-native-presentation
        run: |
          system_profiler SPDisplaysDataType
          mkfifo "$RUNNER_TEMP/display.fifo"
          core/native/darwin/build/virtual_display 1440 900 > "$RUNNER_TEMP/display.fifo" &
          display=$!
          exec 3< "$RUNNER_TEMP/display.fifo"
          online=0
          while read -r -t 60 -u 3 line; do
            echo "$line"
            case "$line" in *" online "*) online=1; break;; esac
          done
          [ "$online" = 1 ] || { echo "the virtual display did not come online"; kill "$display"; exit 1; }
          system_profiler SPDisplaysDataType
          # A display that the system treats as idle composites far below its refresh rate, so the power settings and
          # assertions are printed and the tests run while caffeinate keeps the display awake and declares user activity.
          caffeinate -d -i -u -t 3600 &
          awake=$!
          pmset -g
          pmset -g assertions
          status=0
          make -C core/native/darwin test-presentation || status=$?
          kill "$awake" "$display"
          while read -r -t 10 -u 3 line; do echo "$line"; done
          wait "$display" || true
          exit "$status"

  window-checks:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Place the check configurations
        run: echo "SOKSAK_CONFIG_ROOT=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-browser
          path: plugins/browser
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-editor
          path: plugins/editor
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-files
          path: plugins/files
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-hwp
          path: plugins/hwp
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-terminal
          path: plugins/terminal
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/sidecar-files
          path: sidecars/files
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/sidecar-vt
          path: sidecars/vt
      - uses: actions/setup-node@v4
        with:
          node-version-file: core/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/package.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/host/wailsv3/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the plugin and sidecar repositories
        working-directory: core
        run: make registry-install
      - name: Build both applications
        working-directory: core
        run: make prepare wailsv3-build tauriv2-build
      - name: Build the virtual display program
        working-directory: core
        run: make -C native/darwin "$GITHUB_WORKSPACE/core/native/darwin/build/virtual_display"
      # The display stays online for the later steps: the step reads its online line from a FIFO and leaves a reader that
      # copies the later lines of the program to a file.
      - name: Start the virtual display
        run: |
          mkfifo "$RUNNER_TEMP/display.fifo"
          nohup core/native/darwin/build/virtual_display 1440 900 > "$RUNNER_TEMP/display.fifo" 2> "$RUNNER_TEMP/display.err" &
          echo "$!" > "$RUNNER_TEMP/display.pid"
          exec 3< "$RUNNER_TEMP/display.fifo"
          online=0
          while read -r -t 60 -u 3 line; do
            echo "$line"
            case "$line" in *" online "*) online=1; break;; esac
          done
          [ "$online" = 1 ] || { echo "the virtual display did not come online" >&2; cat "$RUNNER_TEMP/display.err" >&2; exit 1; }
          nohup cat <&3 > "$RUNNER_TEMP/display.out" &
          # The display stays awake and the system counts the user as active while the checks run (see the presentation job).
          nohup caffeinate -d -i -u -t 10800 > /dev/null 2>&1 &
          echo "$!" > "$RUNNER_TEMP/awake.pid"
          pmset -g assertions
      - name: Prepare the check configurations
        working-directory: core
        run: |
          make e2e-registry-tls
          make install-plugins CONFIG="$SOKSAK_CONFIG_ROOT/soksak-check-wailsv3"
          make install-plugins CONFIG="$SOKSAK_CONFIG_ROOT/soksak-check-tauriv2"
          echo "SOKSAK_CANDIDATE_REGISTRY=file://$GITHUB_WORKSPACE/core/target/registry/index.json" >> "$GITHUB_ENV"
      - name: Start both applications
        working-directory: core
        run: |
          for app in wailsv3 tauriv2; do
            config="$SOKSAK_CONFIG_ROOT/soksak-check-$app"
            nohup "target/debug/soksak-$app.app/Contents/MacOS/soksak-$app" --config-dir "$config" \
              --registry-ca "$SOKSAK_CONFIG_ROOT/soksak-check-registry-tls/ca.pem" > "$RUNNER_TEMP/$app.out" 2>&1 &
            echo "$!" > "$RUNNER_TEMP/$app.pid"
          done
          for app in wailsv3 tauriv2; do
            waited=0
            until [ -f "$SOKSAK_CONFIG_ROOT/soksak-check-$app/endpoint.json" ]; do
              if [ "$waited" -ge 60 ]; then echo "$app wrote no endpoint.json in 60 seconds" >&2; exit 1; fi
              sleep 1
              waited=$((waited + 1))
            done
          done
      - name: Make Finder frontmost
        run: osascript -e 'tell application "Finder" to activate'
      - name: Window checks
        working-directory: core
        run: pnpm verify:windows --when-idle 45
      - name: Locate the run folder
        id: run
        if: always()
        working-directory: core
        run: |
          # Without a run folder the outputs stay empty, so the upload holds no part of the checkout.
          folder="$(ls -td target/test-runs/*/ | head -n 1)"
          if [ -n "$folder" ]; then printf 'folder=%s\npath=core/%s\n' "${folder%/}" "${folder%/}"; fi >> "$GITHUB_OUTPUT"
      - name: Audit of the logs
        if: always() && steps.run.outputs.folder != ''
        working-directory: core
        run: node scripts/audit-run.mjs "${{ steps.run.outputs.folder }}"
      - name: Stop both applications, the display and caffeinate
        if: always()
        run: |
          for app in wailsv3 tauriv2 display awake; do
            if [ -f "$RUNNER_TEMP/$app.pid" ]; then kill "$(cat "$RUNNER_TEMP/$app.pid")" || echo "$app had ended before the stop" >&2; fi
          done
          # The step shell is not the parent of the applications, so no exit event reaches it; it reads their state every 0.2
          # seconds for at most 60 seconds.
          for app in wailsv3 tauriv2; do
            if [ ! -f "$RUNNER_TEMP/$app.pid" ]; then continue; fi
            pid="$(cat "$RUNNER_TEMP/$app.pid")"
            waited=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$waited" -ge 300 ]; then echo "$app did not end in 60 seconds after the stop" >&2; exit 1; fi
              sleep 0.2
              waited=$((waited + 1))
            done
          done
      # A host that crashed wrote `error native fatal: <signal>` to its standard error; the stack of the crash is only in the
      # report that the system writes after the process ends. The system sends no event for the report, so the step reads the
      # folder every second for at most 60 seconds and fails with the name of the application whose report did not appear.
      - name: Keep the crash reports
        if: always()
        run: |
          reports="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$RUNNER_TEMP/crash-reports"
          for app in wailsv3 tauriv2; do
            if ! grep -qs ' error native fatal: ' "$RUNNER_TEMP/soksak-check-$app"/logs/host-*.stderr; then continue; fi
            waited=0
            until ls "$reports"/soksak-$app-*.ips > /dev/null 2>&1; do
              if [ "$waited" -ge 60 ]; then echo "soksak-$app crashed and the system wrote no crash report in 60 seconds" >&2; exit 1; fi
              sleep 1
              waited=$((waited + 1))
            done
            cp "$reports"/soksak-$app-*.ips "$RUNNER_TEMP/crash-reports/"
          done
          # A host that the system ended with SIGKILL writes no record; the memory pressure reports and the kernel records
          # of ended processes name it.
          find "$reports" -maxdepth 1 -name 'JetsamEvent-*.ips' -exec cp {} "$RUNNER_TEMP/crash-reports/" \;
          log show --last 3h --style compact --predicate 'process == "kernel" AND eventMessage CONTAINS "memorystatus"' > "$RUNNER_TEMP/crash-reports/memorystatus.log"
      - name: Keep the run folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-display-window-checks
          path: |
            ${{ steps.run.outputs.path }}
            ${{ runner.temp }}/soksak-check-wailsv3/logs
            ${{ runner.temp }}/soksak-check-tauriv2/logs
            ${{ runner.temp }}/display.out
            ${{ runner.temp }}/display.err
            ${{ runner.temp }}/wailsv3.out
            ${{ runner.temp }}/tauriv2.out
            ${{ runner.temp }}/crash-reports
          if-no-files-found: warn
