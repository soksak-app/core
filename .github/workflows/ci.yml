name: ci
# build-machine: skip smoke reason=the end-to-end checks need a display and run only locally through make (docs/operations/examples.md#test-kinds)

# release.yml calls this workflow on each push to main, so a push runs the checks once.
on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  core-node:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Core package tests
        env:
          npm_config_offline: 'true'
        run: node core/scripts/node-tests.mjs --exclude scripts/ --exclude native/
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  macos-wailsv3:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/wailsv3
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch Go modules
        working-directory: core
        run: |
          go -C apps/wailsv3 mod download
          go -C packages/host/wailsv3 mod download
          go -C packages/sok/wailsv3 mod download
      - name: Fetch pinned native release file
        run: make -C core native-darwin-fetch
      - name: Wails host tests
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
          OFFLINE: '1'
        run: make -C core host-test-wailsv3
      - name: Go format checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=readonly'
        run: make -C core go-format-check
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  macos-tauriv2:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        working-directory: core
        run: cargo fetch --locked
      - name: Fetch pinned native release file
        run: make -C core native-darwin-fetch
      - name: Tauri host tests
        env:
          npm_config_offline: 'true'
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
          GOPROXY: 'off'
          GOFLAGS: -mod=readonly
          OFFLINE: '1'
        run: make -C core host-test-tauriv2
      - name: Rust format and clippy checks
        env:
          CARGO_NET_OFFLINE: 'true'
          OFFLINE: '1'
        run: make -C core rust-format-check rust-clippy-check
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  native-darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch pinned native release file
        run: make -C core native-darwin-fetch
      - name: Build the native library offline
        env:
          OFFLINE: '1'
        run: make -C core native-darwin
      # The displays, the power state and the console session of the runner are recorded before the tests, because the tests
      # that record windows or wait for presentation depend on them and the test output does not state them (F239-303).
      - name: Record the display session
        run: |
          system_profiler SPDisplaysDataType
          pmset -g
          ioreg -n Root -d1 -k IOConsoleUsers
      - name: Native Darwin tests
        env:
          OFFLINE: '1'
          SOKSAK_NATIVE_TEST_RUN_FOLDER: ${{ runner.temp }}/soksak-native-darwin
        run: make -C core/native/darwin test
      - name: Native process identity package tests
        env:
          OFFLINE: '1'
        run: pnpm -C core/native/darwin/process-identity test
      - name: Resolve user DiagnosticReports directory
        if: failure()
        id: native-diagnostic-reports
        shell: bash
        run: |
          directory="$(swift -e 'import Foundation; guard let library = FileManager.default.urls(for: .libraryDirectory, in: .userDomainMask).first else { fputs("user Library directory is unavailable\n", stderr); exit(1) }; print(library.appendingPathComponent("Logs/DiagnosticReports", isDirectory: true).path)')"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - name: Keep native Darwin failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-failure
          path: |
            ${{ runner.temp }}/soksak-native-darwin
            ${{ steps.native-diagnostic-reports.outputs.directory }}
          if-no-files-found: warn
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  equivalence:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
          fetch-depth: 0
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/wailsv3
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch Go modules
        working-directory: core
        run: |
          go -C apps/wailsv3 mod download
          go -C packages/host/wailsv3 mod download
          go -C packages/sok/wailsv3 mod download
      - name: Fetch locked Rust dependencies
        working-directory: core
        run: cargo fetch --locked
      - name: Fetch pinned native release file
        run: make -C core native-darwin-fetch
      - name: Commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: make -C core commits-check RANGE=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Structure checks
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
          OFFLINE: '1'
        run: make -C core docs-check boundaries platforms hosts-check exposure-check parity-check host-parity-check events-check census-check
      - name: Cross-toolchain script tests
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
          OFFLINE: '1'
        run: node core/scripts/node-tests.mjs --only scripts/
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  required:
    if: always()
    needs:
      - core-node
      - macos-wailsv3
      - macos-tauriv2
      - native-darwin
      - equivalence
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Require every CI job
        env:
          CORE_NODE: ${{ needs.core-node.result }}
          WAILS: ${{ needs.macos-wailsv3.result }}
          TAURI: ${{ needs.macos-tauriv2.result }}
          NATIVE: ${{ needs.native-darwin.result }}
          EQUIVALENCE: ${{ needs.equivalence.result }}
        run: |
          for result in "$CORE_NODE" "$WAILS" "$TAURI" "$NATIVE" "$EQUIVALENCE"; do
            test "$result" = success || exit 1
          done
