name: ci
# build-machine: skip smoke reason=the window checks need a signed-in desktop and run before a release on the development Mac (docs/operations/examples.md)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      # 구조 검사는 형제 폴더의 plugin 과 sidecar repository 를 읽는다(docs/spec/plugins.md#repositories 의 배치).
      - uses: actions/checkout@v4
        with:
          path: core
          # 커밋 메시지 검사는 push 와 pull request 의 커밋 범위를 읽는다.
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-browser
          path: plugins/browser
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-editor
          path: plugins/editor
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-files
          path: plugins/files
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/plugin-terminal
          path: plugins/terminal
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/sidecar-files
          path: sidecars/files
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/sidecar-vt
          path: sidecars/vt
      - uses: actions/setup-node@v4
        with:
          node-version-file: core/.node-version
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: core/package.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/host/wailsv3/go.mod
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        run: make -C core build native-darwin
      - name: Commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: make -C core commits-check RANGE=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Structure checks
        run: make -C core docs-check boundaries platforms hosts-check exposure-check parity-check host-parity-check
      - name: Host tests
        run: make -C core host-contract-check rust-format-check go-format-check rust-clippy-check
      - name: Package tests
        run: pnpm -C core test

  # sok 은 Linux 에서도 실행된다(docs/spec/cli.md#operating-systems). 두 언어의 sok 테스트를 Linux 에서 실행한다.
  sok-linux:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/sok/wailsv3/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Build sok
        run: |
          go build -C packages/sok/wailsv3 ./...
          cargo build --locked -p soksak-sok-tauriv2
      - name: Go sok tests
        run: go test -C packages/sok/wailsv3 -count=1 ./...
      - name: Rust sok tests
        run: cargo test --locked -p soksak-sok-tauriv2
