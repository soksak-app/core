name: ci
# build-machine: skip smoke reason=the end-to-end checks need a display and run only locally through make (docs/operations/examples.md#test-kinds)

# release.yml calls this workflow on each push to main, so a push runs the checks once.
on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  core-node:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
          fetch-depth: 0
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      # Setup tests of the core packages run cargo metadata; the job installs the toolchain that rust-toolchain.toml declares,
      # so no test installs it through the rustup proxy while another test does.
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Core package tests
        env:
          npm_config_offline: 'true'
        run: node core/scripts/node-tests.mjs --exclude scripts/ --exclude native/
      - name: Required mutations for changed owners
        env:
          npm_config_offline: 'true'
          MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          MUTATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SOKSAK_MUTATION_RUN_FOLDER: ${{ runner.temp }}
        run: node core/packages/soksak/scripts/check-breaks.mjs --changed "$MUTATION_BASE...$MUTATION_HEAD"
      - name: Keep required mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-mutation-evidence
          path: ${{ runner.temp }}/soksak-break-evidence-*
          if-no-files-found: ignore
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  macos-wailsv3:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/wailsv3
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch Go modules
        working-directory: core
        run: |
          go -C apps/wailsv3 mod download
          go -C packages/host/go mod download
          go -C packages/host/wailsv3 mod download
          go -C packages/sok/go mod download
      - name: Wails host tests
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
        run: make -C core test-wailsv3
      - name: Go format checks
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=readonly'
        run: make -C core check-go-format
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  macos-tauriv2:
    runs-on: macos-15
    # The five test builds compile and link 251 test executables and take most of the job; line tables reduce the debug
    # information that each build writes and links, and keep the file and line of a panic and a backtrace. The variable is
    # set on the job so that the Rust cache key holds it.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch locked Rust dependencies
        working-directory: core
        run: cargo fetch --locked
      - name: Tauri host tests
        env:
          npm_config_offline: 'true'
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
          GOPROXY: 'off'
          GOFLAGS: -mod=readonly
        run: make -C core test-tauriv2
      - name: Rust format and clippy checks
        env:
          CARGO_NET_OFFLINE: 'true'
        run: make -C core check-rust-format check-rust-clippy
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  macos-mygo:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/mygo
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch Go modules
        working-directory: core
        run: |
          go -C apps/mygo mod download
          go -C packages/host/go mod download
          go -C packages/host/mygo mod download
          go -C packages/sok/go mod download
      - name: mygo host tests
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
        run: make -C core test-mygo
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  build-native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Build the native library offline
        run: make -C core build-native
      # The displays, the power state and the console session of the runner are recorded before the tests, because the tests
      # that record windows or wait for presentation depend on them and the test output does not state them (F239-303).
      - name: Record the display session
        run: |
          system_profiler SPDisplaysDataType
          pmset -g
          ioreg -n Root -d1 -k IOConsoleUsers
      - name: Native Darwin tests
        env:
          SOKSAK_NATIVE_TEST_RUN_FOLDER: ${{ runner.temp }}/soksak-native-darwin
        run: make -C core/native/darwin test
      - name: Native process identity package tests
        run: pnpm -C core/native/darwin/process-identity test
      - name: Resolve user DiagnosticReports directory
        if: failure()
        id: native-diagnostic-reports
        shell: bash
        run: |
          directory="$(swift -e 'import Foundation; guard let library = FileManager.default.urls(for: .libraryDirectory, in: .userDomainMask).first else { fputs("user Library directory is unavailable\n", stderr); exit(1) }; print(library.appendingPathComponent("Logs/DiagnosticReports", isDirectory: true).path)')"
          printf 'directory=%s\n' "$directory" >> "$GITHUB_OUTPUT"
      - name: Keep native Darwin failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-darwin-failure
          path: |
            ${{ runner.temp }}/soksak-native-darwin
            ${{ steps.native-diagnostic-reports.outputs.directory }}
          if-no-files-found: warn
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  equivalence:
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
          fetch-depth: 0
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/wailsv3
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Fetch locked Node dependencies
        run: pnpm -C core install --frozen-lockfile
      - name: Fetch Go modules
        working-directory: core
        run: |
          go -C apps/wailsv3 mod download
          go -C packages/host/go mod download
          go -C packages/host/wailsv3 mod download
          go -C packages/sok/go mod download
      - name: Fetch locked Rust dependencies
        working-directory: core
        run: cargo fetch --locked
      - name: Commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: make -C core check-commits RANGE=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Checklist history
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: make -C core check-checklist-history RANGE=${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
      - name: Structure checks
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
        run: make -C core check-docs check-commands check-boundaries check-platform-files check-host-files check-exposure check-tests check-hosts-same check-events
      # The owner tests of scripts/test run the sok executable of the declared build, which the tests name when it is missing.
      - name: Build the sok executable
        env:
          CARGO_INCREMENTAL: '0'
        run: make -C core build-sok
      - name: Cross-toolchain script tests
        env:
          npm_config_offline: 'true'
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: -mod=readonly
          CARGO_NET_OFFLINE: 'true'
          CARGO_INCREMENTAL: '0'
        run: node core/scripts/node-tests.mjs --only scripts/
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  linux-node:
    runs-on: ubuntu-26.04-arm
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
          fetch-depth: 0
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: packages/host/wailsv3
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      # The owners run these system tools: zsh for the ZLE fixture of the window checks, clang for the AST dumps of the host API and
      # callback headers, pkg-config for the native package files, unzip for the candidate files, and the C++ toolchain and
      # Python with which pnpm builds the file watcher of @parcel/watcher from source.
      - name: Install the system tools of the owners
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh clang pkg-config unzip build-essential python3
      # pnpm runs the lifecycle scripts of every workspace project without reading its os field, so the install leaves out the
      # projects that exclude Linux, whose prepare builds native code against Apple frameworks.
      - name: Fetch locked Node dependencies
        run: node core/scripts/install-platform.mjs linux
      # The owner tests of scripts/test run the sok executable of the declared build, which the tests name when it is missing.
      - name: Build the sok executable
        run: make -C core build-sok
      - name: Headless owner tests
        env:
          npm_config_offline: 'true'
        run: make -C core test-headless-owners
      - name: Reject lockfile changes
        if: always()
        run: git -C core diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  required:
    if: always()
    needs:
      - core-node
      - macos-wailsv3
      - macos-tauriv2
      - macos-mygo
      - build-native
      - equivalence
      - linux-node
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Require every CI job
        env:
          CORE_NODE: ${{ needs.core-node.result }}
          WAILS: ${{ needs.macos-wailsv3.result }}
          TAURI: ${{ needs.macos-tauriv2.result }}
          MYGO: ${{ needs.macos-mygo.result }}
          NATIVE: ${{ needs.build-native.result }}
          EQUIVALENCE: ${{ needs.equivalence.result }}
          LINUX_NODE: ${{ needs.linux-node.result }}
        run: |
          for result in "$CORE_NODE" "$WAILS" "$TAURI" "$MYGO" "$NATIVE" "$EQUIVALENCE" "$LINUX_NODE"; do
            test "$result" = success || exit 1
          done
