name: release
# build-machine: skip smoke reason=the end-to-end checks need a display and run only locally through make (docs/operations/examples.md#test-kinds)

# A push runs the checks and builds the release files of a new version; the same run publishes those files when every check and
# every build succeeded.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One run at a time, so two pushes never release one version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  # The gate and the bundle builds run beside the checks, so a release run takes the time of its longest job; publication requires
  # a run in which the checks and every build succeeded.
  gate:
    runs-on: ubuntu-26.04-arm
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-node
        with:
          root: .
      - name: Install the kit
        run: pnpm install --frozen-lockfile --filter soksak-workspace
      - name: Decide the release
        id: gate
        run: pnpm exec sok-check release packages/plugin-api/package.json docs/features.md

  release-wailsv3:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    # The actool of Xcode 26.3 on macOS 15 ends with a dyld error while it compiles the Icon Composer source of the application icon
    # (docs/spec/hosts.md#frontend-and-executables, F1183).
    runs-on: macos-26
    env:
      GOTOOLCHAIN: local
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: apps/wailsv3
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Install locked dependencies
        run: |
          make check-tools
          CI=1 PNPM_DISABLE_SELF_UPDATE_CHECK=1 pnpm install --frozen-lockfile
          go -C apps/wailsv3 mod download
          go -C packages/sok/go mod download
      - name: Build and audit Wails release bundle offline
        env:
          npm_config_offline: 'true'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: make check-release-wailsv3
      - name: Package Wails release bundle
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent target/release/wailsv3/soksak.app "dist/soksak-$version-darwin-arm64-wailsv3.zip"
      # The plugins and sidecars build with the sok inside an application zip of this release and pin the packed releases of
      # @soksak/plugin-api and @soksak/native-process-identity-darwin, and a plugin drives this release through the packed
      # @soksak/window-check, whose release file holds its workspace dependencies, so no workflow of theirs checks out
      # a source of core.
      - name: Package the releases that plugins and sidecars build with
        run: |
          make -C native/darwin/process-identity
          node scripts/pack-release-packages.mjs dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-wailsv3
          path: core/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  release-tauriv2:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    # The actool of Xcode 26.3 on macOS 15 ends with a dyld error while it compiles the Icon Composer source of the application icon
    # (docs/spec/hosts.md#frontend-and-executables, F1183).
    runs-on: macos-26
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Install locked dependencies
        run: |
          make check-tools
          CI=1 PNPM_DISABLE_SELF_UPDATE_CHECK=1 pnpm install --frozen-lockfile
          cargo fetch --locked
      - name: Build and audit Tauri release bundle offline
        env:
          npm_config_offline: 'true'
          CARGO_NET_OFFLINE: 'true'
        run: make check-release-tauriv2
      - name: Package Tauri release bundle
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent target/release/tauriv2/soksak.app "dist/soksak-$version-darwin-arm64-tauriv2.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tauriv2
          path: core/dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  release-mygo:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    # The actool of Xcode 26.3 on macOS 15 ends with a dyld error while it compiles the Icon Composer source of the application icon
    # (docs/spec/hosts.md#frontend-and-executables, F1183).
    runs-on: macos-26
    env:
      GOTOOLCHAIN: local
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: apps/mygo
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Install locked dependencies
        run: |
          make check-tools
          CI=1 PNPM_DISABLE_SELF_UPDATE_CHECK=1 pnpm install --frozen-lockfile
          go -C apps/mygo mod download
          go -C packages/sok/go mod download
      - name: Build and audit mygo release bundle offline
        env:
          npm_config_offline: 'true'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: make check-release-mygo
      - name: Package mygo release bundle
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent target/release/mygo/soksak.app "dist/soksak-$version-darwin-arm64-mygo.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-mygo
          path: core/dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  # Publication waits for every check and every build of the run and publishes the files of that run, so no file is built again.
  publish:
    needs: [checks, gate, release-wailsv3, release-tauriv2, release-mygo]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-node
        with:
          root: .
      - name: Install locked release file check dependencies
        run: pnpm install --frozen-lockfile --filter soksak-workspace
      - name: Install release inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes unzip
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-files
      - name: Require the exact release files
        run: node scripts/candidate-acceptance.mjs files "$RUNNER_TEMP/release-files"
      # The release page resolves relative links against the tag; notes are outside the published release files.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: node scripts/release-notes.mjs docs/operations/install.md "$GITHUB_REPOSITORY" "v$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Require the commit to be the head of main and the tag to be absent
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "publication requires main" >&2; exit 1; }
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$head" = "$GITHUB_SHA" || { echo "main is at $head, not at $GITHUB_SHA" >&2; exit 1; }
          tags="$(git ls-remote --tags origin "refs/tags/v$VERSION")"
          test -z "$tags" || { echo "the tag v$VERSION exists" >&2; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/release-files/*
          body_path: ${{ runner.temp }}/release-notes.md
