name: release
# build-machine: skip smoke reason=the end-to-end checks need a display and run only locally through make (docs/operations/examples.md#test-kinds)

# A push builds immutable candidate files. Publication reuses those files after authenticated local acceptance of that attempt.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      acceptance:
        description: Compact candidate acceptance report JSON
        required: true
        type: string

permissions:
  contents: read

# One run at a time, so two pushes never release one version twice.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # The gate and the bundle builds run beside the checks, so a release run takes the time of its longest job; publish requires
  # the success of the checks and of both builds.
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04-arm
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-node
        with:
          root: .
      - name: Install the kit
        run: pnpm install --frozen-lockfile --filter soksak-workspace
      - name: Decide the release
        id: gate
        run: pnpm exec sok-check release packages/plugin-api/package.json docs/features.md

  release-wailsv3:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-15
    env:
      GOTOOLCHAIN: local
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-go
        with:
          root: core
          module: apps/wailsv3
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Install locked dependencies
        run: |
          make check-tools
          CI=1 PNPM_DISABLE_SELF_UPDATE_CHECK=1 pnpm install --frozen-lockfile
          go -C apps/wailsv3 mod download
          go -C packages/sok/wailsv3 mod download
      - name: Fetch the pinned native release file
        run: make fetch-native
      - name: Build and audit Wails release bundle offline
        env:
          OFFLINE: '1'
          npm_config_offline: 'true'
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: make check-release-wailsv3
      - name: Package Wails release bundle
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent target/release/wailsv3/soksak.app "dist/soksak-$version-darwin-arm64-wailsv3.zip"
      # The plugins and sidecars build with the sok inside an application zip of this release and pin the packed releases of
      # @soksak/plugin-api and @soksak/native-process-identity-darwin, so their workflows check out no source of core.
      - name: Package the releases that plugins and sidecars build with
        run: |
          version="${{ needs.gate.outputs.version }}"
          make -C native/darwin/process-identity
          pnpm -C packages/plugin-api pack --pack-destination "$PWD/dist"
          pnpm -C native/darwin/process-identity pack --pack-destination "$PWD/dist"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-wailsv3
          path: core/dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  release-tauriv2:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: core
      - uses: ./core/.github/actions/setup-node
        with:
          root: core
      - uses: ./core/.github/actions/setup-rust
        with:
          root: core
      - uses: ./core/.github/actions/setup-native
        with:
          root: core
      - name: Install locked dependencies
        run: |
          make check-tools
          CI=1 PNPM_DISABLE_SELF_UPDATE_CHECK=1 pnpm install --frozen-lockfile
          cargo fetch --locked
      - name: Fetch the pinned native release file
        run: make fetch-native
      - name: Build and audit Tauri release bundle offline
        env:
          OFFLINE: '1'
          npm_config_offline: 'true'
          CARGO_NET_OFFLINE: 'true'
        run: make check-release-tauriv2
      - name: Package Tauri release bundle
        run: |
          version="${{ needs.gate.outputs.version }}"
          mkdir -p dist
          ditto -c -k --keepParent target/release/tauriv2/soksak.app "dist/soksak-$version-darwin-arm64-tauriv2.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-tauriv2
          path: core/dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'

  publish:
    runs-on: ubuntu-26.04-arm
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-node
        with:
          root: .
      - name: Install locked acceptance dependencies
        run: pnpm install --frozen-lockfile --filter soksak-workspace
      - name: Install release inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes unzip
      - name: Read the submitted acceptance report
        env:
          ACCEPTANCE_REPORT: ${{ inputs.acceptance }}
        run: node -e 'require("node:fs").writeFileSync(process.env.RUNNER_TEMP + "/acceptance.json", process.env.ACCEPTANCE_REPORT)'
      - name: Require the exact successful candidate attempt
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/candidate-acceptance.mjs prepare "$RUNNER_TEMP/acceptance.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.candidate.outputs.artifact_ids }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-files
      - name: Require acceptance of the exact publication files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/candidate-acceptance.mjs verify "$RUNNER_TEMP/acceptance.json" "$RUNNER_TEMP/release-files"
      # The release page resolves relative links against the tag; notes are outside the published release files.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: node scripts/release-notes.mjs docs/operations/install.md "$GITHUB_REPOSITORY" "v$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Require the commit to be the head of main and the tag to be absent
        env:
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "publication requires main" >&2; exit 1; }
          head="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$head" = "$GITHUB_SHA" || { echo "main is at $head, not at $GITHUB_SHA" >&2; exit 1; }
          tags="$(git ls-remote --tags origin "refs/tags/v$VERSION")"
          test -z "$tags" || { echo "the tag v$VERSION exists" >&2; exit 1; }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ steps.candidate.outputs.version }}
          target_commitish: ${{ steps.candidate.outputs.sha }}
          files: ${{ runner.temp }}/release-files/*
          body_path: ${{ runner.temp }}/release-notes.md
