name: release
# build-machine: skip test reason=the ci workflow tests the tagged commit on main before the tag is pushed
# build-machine: skip smoke reason=the window checks need a signed-in desktop and run before a release on the development Mac (docs/operations/examples.md)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/host/wailsv3/go.mod
      - uses: dtolnay/rust-toolchain@stable
      # release 번들을 빌드하고 진단 코드가 없는지 검사한다.
      - name: Build
        run: make release-check
      # 릴리즈 빌드가 이전 릴리즈가 쓴 저장 데이터에서 시작하는지 확인한다(docs/spec/installation.md#stored-data-migration, F189).
      - name: Migrate the stored data of the earlier release
        run: |
          config="$(mktemp -d)"
          mkdir -p "$config/plugins"
          cat > "$config/plugins/installed.json" <<'JSON'
          {"format":2,"plugins":{"probe":{"package":"@scope/plugin-probe","version":"1.0.0","path":"plugins/probe/1.0.0","enabled":true,"sidecars":{}}},"sidecars":{}}
          JSON
          timeout 30 "target/release/tauriv2/soksak.app/Contents/MacOS/soksak-tauriv2" --config-dir "$config" &
          host=$!
          for _ in $(seq 1 100); do
            grep -q '"event":"log.open"' "$config"/logs/host-*.jsonl 2>/dev/null && break
            sleep 0.3
          done
          kill $host 2>/dev/null || true
          wait $host 2>/dev/null || true
          grep -q '"format": *3\|"format":3' "$config/plugins/installed.json"
          grep -q '"event":"log.migrated"' "$config"/logs/host-*.jsonl
          rm -rf "$config"
      # 서명하지 않은 번들이므로 설치 안내를 release 본문으로 쓴다(docs/operations/install.md).
      - name: Package
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          mkdir dist
          ditto -c -k --keepParent target/release/wailsv3/soksak.app "dist/soksak-$version-darwin-arm64-wailsv3.zip"
          ditto -c -k --keepParent target/release/tauriv2/soksak.app "dist/soksak-$version-darwin-arm64-tauriv2.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/operations/install.md
