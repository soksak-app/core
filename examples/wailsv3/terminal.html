<!doctype html>
<meta charset="utf-8">
<title>terminal</title>
<!--
  A terminal surface: a webview inside the window, with a shell process behind
  it. A console, not a terminal emulator — output is text and input is a line at
  a time.

  This page is loaded straight into a native view, so it has no bridge to Go.
  It reads the shell's output as an event stream and posts what is typed.
-->
<style>
  html, body { margin: 0; height: 100%; background: var(--surface) }
  body {
    display: flex; flex-direction: column;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--surface-fg);
  }
  #out { flex: 1 1 auto; margin: 0; padding: 6px 9px; overflow-y: auto;
         white-space: pre-wrap; word-break: break-word }
  #line { display: flex; gap: 6px; padding: 4px 9px 6px;
          border-top: 1px solid color-mix(in srgb, var(--surface-fg) 22%, transparent) }
  #line span { color: color-mix(in srgb, var(--surface-fg) 55%, transparent) }
  #in { flex: 1 1 auto; min-width: 0; border: 0; background: transparent;
        color: inherit; font: inherit; outline: 0 }
</style>
<pre id="out"></pre>
<div id="line"><span>$</span><input id="in" autocomplete="off" spellcheck="false"></div>
<script>
  /* A page served here is a document of its own and inherits none of the main
     page's stylesheet, so the theme arrives as values and is set here. It has no
     bridge to Go either, so a change arrives on the stream that carries the
     shell's output: this page may hold only a few connections to that server. */
  function applyTheme(theme) {
    const root = document.documentElement;
    root.style.colorScheme = theme.scheme;
    for (const [token, value] of Object.entries(theme.tokens)) {
      root.style.setProperty(token, value);
    }
  }

  fetch("/theme").then((r) => r.json()).then(applyTheme);

  const id = new URLSearchParams(location.search).get("id");
  const out = document.getElementById("out");
  const input = document.getElementById("in");

  function write(text) {
    // Kept at the bottom only when it was already there, so reading back does
    // not fight the output.
    const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
    out.append(text);
    if (atEnd) out.scrollTop = out.scrollHeight;
  }

  const query = `?id=${encodeURIComponent(id)}`;

  fetch(`/terminal/open${query}`, { method: "POST" }).then(() => {
    const stream = new EventSource(`/terminal/stream${query}`);
    stream.addEventListener("output", (e) => write(JSON.parse(e.data)));
    stream.addEventListener("theme", (e) => applyTheme(JSON.parse(e.data)));
  });

  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const line = input.value;
    input.value = "";
    write(`$ ${line}\n`);
    fetch(`/terminal/write${query}`, { method: "POST", body: `${line}\n` });
  });

  addEventListener("click", () => input.focus());
  input.focus();
</script>
