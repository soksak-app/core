[package]
name = "soksak-tauri"
version = "0.1.0"
edition = "2021"
description = "soksak layout running in Tauri v2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
incremental = true

# Rounding a view's corners is public API on each platform, and each one needs
# its own call. Nothing here is a private interface.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

# wry 0.56 stops a webview painting white before its document does, and no
# published tauri uses it yet: tauri-runtime-wry pins wry 0.55 on crates.io and
# 0.56 only on main. These patches take the whole tauri family from that commit.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "270c63f117eb1f4ff0a653ca63b2ca61e9175663" }
