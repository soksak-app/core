<!doctype html>
<meta charset="utf-8">
<title>native modal</title>
<!--
  Renders one [data-native-modal] element of the main page.

  DOM cannot be drawn over a native view, and a webview is a native view that
  renders DOM. This page is loaded into a view created after the surface views,
  so it is placed above them and the surfaces keep running.

  It receives the element's class name, its markup and the page's stylesheet.
  A click on any element carrying data-key is reported to the main page.
-->
<style>
  /* Set in the markup so it applies before any script runs. A webview shows
     white until its document paints. */
  html, body { margin: 0; padding: 0; height: 100%; background: #1b1d27 }
</style>
<script type="module">
  import { page } from "./framework/index.js";
  import { onGripDrag, showValue } from "./card.js";

  /* 이 페이지는 별도 문서라 메인 페이지의 스타일시트를 상속하지 않는다. 테마를
     값으로 받아 자기 루트에 설정한다. */
  function applyTheme(theme) {
    const root = document.documentElement;
    root.style.colorScheme = theme.scheme;
    for (const [token, value] of Object.entries(theme.tokens)) {
      root.style.setProperty(token, value);
    }
  }

  page.theme(applyTheme);

  const id = new URLSearchParams(location.search).get("id");
  let sheet = null;
  let root = null;

  function render({ css, className, html, border }) {
    if (!sheet) {
      document.head.insertAdjacentHTML("beforeend", `<style id="page"></style>`);
      sheet = document.getElementById("page");
      // The page's stylesheet arrives whole, including its body rule. This block
      // is inserted after it so it takes precedence.
      document.head.insertAdjacentHTML("beforeend", `<style>
        html, body { margin: 0; padding: 0; height: 100% }
        /* 카드는 메인 페이지에서 자기 위치를 지정한다. 이 뷰는 카드 하나만 담으므로
           그 위치 지정을 모두 해제한다. transform 을 남기면 카드가 폭의 절반만큼
           이동해 왼쪽이 잘린다. */
        body > * { position: static !important; inset: auto !important;
                   transform: none !important; margin: 0 !important;
                   max-height: none !important }
      </style>`);
      root = document.createElement("div");
      document.body.appendChild(root);
    }
    sheet.textContent = css;
    root.className = className;
    root.innerHTML = html;
    root.style.borderColor = border;

    // The view is created before it is filled, so the required size is measured
    // here after layout.
    const r = root.getBoundingClientRect();
    page.modal.fit(id, Math.ceil(r.width), Math.ceil(r.height));
  }

  /* 로드 시 한 번, 이후 내용이 바뀔 때마다 호출한다. 뷰를 다시 만들면 깜빡인다. */
  page.modal.content(id, render);

  /* 응답 형식은 key 와 value 하나씩이다. 클릭은 value 가 비어 있고 값 변경은
     그 값을 담는다. */
  const send = (key, value) => page.modal.answer(id, key, value);

  addEventListener("click", (e) => {
    const hit = e.target.closest("[data-key]");
    if (hit) send(hit.dataset.key, "");
  });
  addEventListener("change", (e) => {
    const el = e.target.closest("[data-set]");
    if (el) send(el.dataset.set, el.type === "checkbox" ? String(el.checked) : el.value);
  });
  addEventListener("keydown", (e) => {
    if (e.key === "Escape") send("", "");
  });

  /* 그립 드래그도 같은 응답으로 보낸다. 이 뷰는 카드의 위치를 알지 않으므로 이동
     거리만 전달하고 위치는 카드를 소유한 페이지가 정한다. */
  onGripDrag(document, (dx, dy) => send("move", `${dx},${dy}`));
  showValue(document);
</script>
