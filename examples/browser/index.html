<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>soksak</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./app.css"></head>
<body>



<!-- 창의 크롬. 브랜드, 프로젝트 탭, 그리고 자주 쓰는 스위치.
     프로젝트 탭은 설정에 따라 여기 서거나 왼쪽 세로 레일로 간다. -->
<header class="chrome-bar">
  <!-- 창을 끄는 영역. 막대의 빈 곳 전체를 덮고, 단추와 탭은 그 위에 배치된다.
       막대 자체에 표시하면 그 표시가 자식에게 상속되어 단추를 눌러도 창이
       이동한다. -->
  <div class="chrome-bar__drag" id="winDrag"></div>
  <div class="brand">SPLIT&#8202;PANE</div>
  <div class="tabs tabs--project" id="projectBar"></div>
  <div class="chrome-bar__acts" id="chromeActs"></div>
</header>

<!-- 프로젝트 탭이 왼쪽에 설 때, 레일이 이 안의 첫 자리에 생긴다. 스페이스 줄보다
     위에서 시작해 아래까지 내려간다 — 프로젝트가 스페이스를 담기 때문이다. -->
<div class="shell" id="shell">
  <div class="work">
  <!-- 스페이스 줄. 한 프로젝트 안의 판들. -->
  <div class="tabs tabs--space" id="spaceBar"></div>

<main class="stage"><div class="plane" id="plane">
  <svg class="rail" id="rail"><path id="railPath"></path></svg>
  <div class="drop" id="drop" hidden></div>
  <div class="picker" id="picker" data-native-modal hidden></div>
  <div class="focus-mark" id="focusMark" hidden></div>
</div></main>
  </div>
</div>

<!-- 이 페이지를 그대로 앱의 프론트엔드로 쓴다. host.js 는 자기를 담고 있는
     것이 무엇인지 framework/ 에게 묻고, 호스트가 없으면 아무것도 놓지 않는다 —
     그러면 페이지가 표면을 스스로 그린다. -->
<script type="module" src="./host.js"></script>
<script type="module">
/* 이 저장소가 방금 만든 빌드를 읽는다 — `pnpm example` 이 build 를 먼저 돌린다.
   여기서 GREEN 인 것은 이 커밋의 dist 에 대해서만 참이다. 호스트가 설치한
   것은 별개이고, 둘은 갈릴 수 있다.

   경로는 서버 루트 기준이다. 저장소를 띄우면 저장소의 dist 를, 애플리케이션에서는
   프론트엔드에 복사된 dist 를 로드한다. 같은 경로가 두 곳에서 동작한다. */
/* 플러그인과 섹션. import 가 곧 등록이므로 가장 먼저 실행한다. 아래의 어떤 코드도
   등록되지 않은 목록을 읽지 않는다. */
import "./plugins/terminal.js";
import "./plugins/browser.js";
import "./plugins/files.js";

import { installTheme } from "/dist/index.js";

/* 판 외부의 값은 settings 가 갖는다. 이 문서는 값이 바뀌었을 때 판을 다시 만든다.
   설정이 판을 직접 호출하면 설정을 추가할 때마다 호출할 함수를 정해야 한다. */
import {
  halfGap, install, modeName, onSettingsChange, set, value,
} from "./settings.js";

/* 표면을 모사하고 보고한다. 판은 슬롯 요소에 값을 기록만 하고 측정과 보고는 이쪽이
   담당한다. */
import { onCommit, onKnobChange, publish, publishAhead } from "./compositor.js";

/* 판 하나. 이 문서는 판의 렌더링 방식을 알지 않고 렌더 완료만 수신한다. */
import {
  build, currentGrid, onLayout, onRender, setGap, settle, tabsOf,
} from "./plane.js";

/* 판과 컴포지터를 읽어 검증한다. 아무것도 변경하지 않으므로 그 둘은 이 모듈을
   알지 않는다. */
import { verify } from "./verify.js";

/* 애플리케이션 인터페이스. 없으면 아무 일도 하지 않는 구현이 온다. */
import { chrome, surfaces as host } from "./host.js";

/* 관측이 지목한 요소를 누른다. 호스트가 요청할 때만 동작한다. */
import "./observe.js";

/* 프로젝트와 그 안의 스페이스. 판은 한 번에 스페이스 하나를 그리고, 전환은 현재
   상태를 저장한 뒤 다른 상태를 적용하는 것이다. */
import * as projects from "./projects.js";
import * as registry from "./plugins/registry.js";

/* 설정 모달. 사이드바를 연결할 자리 목록은 등록된 플러그인이 정한다. */
import { drawSettings, onCommand, openSettings } from "./settings-ui.js";
import { icon } from "./icons.js";
import { adopt, capture, fresh } from "./plane.js";

// 선과 divider 의 모양은 이 시트가 정의한다. 이 문서는 색만 지정하고 아래 :root 가
// 그 토큰을 이 문서의 색에 연결한다.
installTheme(document);

/* 설정값을 문서 루트에 설정한다. 스타일시트가 그 값을 읽는다. */
install();

/* 처리되지 않은 오류를 애플리케이션 로그로 보낸다. 애플리케이션에는 콘솔이 없다. */
addEventListener("error", (e) =>
  host.report(`error: ${e.message} @ ${e.filename}:${e.lineno}`));
addEventListener("unhandledrejection", (e) =>
  host.report(`rejected: ${e.reason}`));

/* ── 배선 ─────────────────────────────────────────────────────────────── */

/**
 * 검증을 실행하고 결과가 달라졌을 때만 기록한다.
 *
 * 검증은 렌더마다 실행된다. 매번 기록하면 같은 줄이 반복되어 변경 시점을 알 수 없다.
 *
 */
let lastSaid = "";

function check() {
  const rows = verify(controlsAt);
  const failed = rows.filter((r) => !r.ok);
  const line = failed.length === 0
    ? `verify: ${rows.length} pass`
    : `verify: ${failed.length} fail — ` +
      failed.map((r) => `${r.name} (${r.note})`).join(" · ");
  if (line === lastSaid) return;
  if (failed.length === 0) console.log(line);
  else console.error(line);
  // 애플리케이션은 자체 로그에 기록한다. 호스트가 없으면 콘솔에만 남는다.
  lastSaid = line;
  host.report(line);
}

/* 표면이 하나도 서지 않는 자리. 잠든 표면은 크기가 없다. */
const NOWHERE = { x: 0, y: 0, w: 0, h: 0 };

/**
 * 지금 그려지지 않는 탭들의 표면.
 *
 * 표면은 탭마다 하나이고, 보이는 것은 그려지는 카드의 활성 탭뿐이다. 나머지도
 * 선언해야 호스트가 살려 둔다 — 그래야 스페이스나 프로젝트를 넘나들어도 셸과
 * 페이지가 그대로다. 선언하지 않으면 호스트가 없는 표면으로 보고 없앤다.
 */
function dormant(shown) {
  const seen = new Set(shown.map((s) => s.id));
  const out = [];
  const add = (tab) => {
    if (seen.has(tab.id)) return;
    seen.add(tab.id);
    out.push({
      id: tab.id, plugin: tab.plugin, layer: 0,
      declared: NOWHERE, applied: NOWHERE, visible: false, dim: false,
      surface: registry.plugin(tab.plugin).surface(tab.id),
    });
  };
  // 지금 판의 탭들. 활성 탭이 아닌 것이 여기서 걸린다.
  for (const card of currentGrid().cards) for (const t of tabsOf(card)) add(t);
  // 다른 스페이스의 탭들. 활성 스페이스는 저장된 배치가 아니라 위의 판이 맞다.
  const here = projects.active();
  for (const p of projects.all()) {
    for (const space of p.spaces) {
      if (p === here && space.id === here.activeSpaceId) continue;
      for (const card of space.layout.state.cards) {
        for (const t of card.data?.tabs ?? []) add(t);
      }
    }
  }
  return out;
}

/* 커밋이 끝나면 호스트에 표면을 알린다. 컴포지터는 이 판의 표면만 알고, 무엇이
   살아 있어야 하는지는 이 문서가 안다. 호스트의 답을 그대로 돌려준다. */
onCommit((record) =>
  host.place({
    ...record,
    surfaces: [...record.surfaces, ...dormant(record.surfaces)],
  }));

/* 판이 다시 그려지면 검증하고 표면을 보고한다. 판은 둘을 알지 않고 둘은 판을 읽기만
   하므로 이 문서에서 연결한다. */
onRender(() => { publish(); check(); });

/* 배치가 바뀌면 그리기 전에 호스트에 알리고, 호스트가 옮긴 뒤에 그린다. 판 위의
   네이티브 뷰는 다른 길로 움직이고 그 길이 더 느리다. 그려 놓고 알리면 한 프레임
   동안 카드는 새 자리에, 뷰는 옛 자리에 있다.

   여백을 아직 재지 못했거나 호스트가 없으면 곧바로 그린다. 그리고 나면 onRender 가
   재서 다시 보고하므로 어느 쪽이든 마지막 값은 같다. */
onLayout((made, draw, seated) => {
  const told = publishAhead(made, seated);
  if (told && typeof told.then === "function") told.then(draw, draw);
  else draw();
});

/* 스페이스가 바뀌면 현재 판을 저장하고 다른 상태를 적용한다. 프로젝트 전환도 같은
   동작이다. */
projects.onSwitch({ save: capture, load: adopt });


/* ── 프로젝트와 스페이스 행 ─────────────────────────────────────────────
   프로젝트를 전환하면 스페이스 목록 전체가, 스페이스를 전환하면 판의 배치 전체가
   교체된다. 같은 동작이므로 경로가 하나다.                                */

const projectBar = document.getElementById("projectBar");
const shell = document.getElementById("shell");
const spaceBar = document.getElementById("spaceBar");
const chromeActs = document.getElementById("chromeActs");

/* 창을 끄는 영역과, 창이 그리는 단추가 차지하는 영역.

   단추는 OS 가 그린다. 제목 표시줄만 투명하고 콘텐츠가 창 전체를 차지하므로 그
   단추가 이 막대 위에 배치된다. 그 폭은 호스트에 요청해서 받고, 막대의 왼쪽을
   그만큼 비운다.

   브라우저에는 창이 없다. 그때 chrome 은 null 이고 막대를 들여쓰지 않는다. */
let controlsAt = null;

if (chrome) {
  chrome.draggable(document.getElementById("winDrag"));
  askControls();
  // 창의 크기가 바뀌면 OS 가 단추를 다시 배치하므로, 그 영역을 다시 요청한다.
  addEventListener("resize", askControls);
}

/** 창이 그리는 단추의 영역을 요청하고, 막대의 들여쓰기를 그 폭으로 설정한다. */
function askControls() {
  chrome.controls().then((at) => {
    if (!at || at.w <= 0) return;
    controlsAt = at;
    document.documentElement.style.setProperty("--controls-w", `${at.x + at.w}px`);
    // 답이 도착해도 렌더는 발생하지 않는다. 검증이 이 값을 읽으므로 여기서 한 번
    // 더 실행한다.
    check();
  });
}

/** 크롬 행의 아이콘 버튼 하나를 만든다. */
function act(name, title, on, onPick) {
  const b = document.createElement("button");
  b.className = "act";
  b.type = "button";
  b.title = title;
  b.dataset.on = String(on);
  b.innerHTML = icon(name);
  b.addEventListener("click", onPick);
  return b;
}

/** 탭 하나를 만든다. 클릭은 전환, 더블클릭은 이름 변경, ✕ 는 닫기다. */
function tab(text, on, { dot, onPick, onClose, onRename }) {
  const el = document.createElement("button");
  el.className = "bar-tab";
  el.type = "button";
  el.dataset.on = String(on);
  el.title = text;
  // 프로젝트 색은 선택된 탭의 배경으로 표시한다. 별도 표식을 두지 않는다.
  if (dot && on) el.style.background = `color-mix(in srgb, ${dot} 24%, transparent)`;
  const name = document.createElement("span");
  name.className = "bar-tab__name";
  name.textContent = text;
  el.appendChild(name);
  el.addEventListener("click", onPick);
  if (onRename) el.addEventListener("dblclick", () => renameInPlace(el, text, onRename));
  if (onClose) {
    const x = document.createElement("span");
    x.className = "bar-tab__x";
    x.textContent = "✕";
    x.addEventListener("click", (e) => { e.stopPropagation(); onClose(); });
    el.appendChild(x);
  }
  return el;
}

/** 탭 자리에서 이름을 변경한다. 빈 값이면 이전 이름을 유지한다. */
function renameInPlace(el, was, take) {
  const input = document.createElement("input");
  input.className = "bar-tab__root";
  input.value = was;
  el.replaceWith(input);
  input.focus();
  input.select();
  const done = (keep) => {
    const title = input.value.trim();
    input.remove();
    if (keep && title) take(title);
    drawBars();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") done(true);
    if (e.key === "Escape") done(false);
  });
  input.addEventListener("blur", () => done(true));
}

/** 「+」 버튼을 만든다. 클릭하면 그 자리에서 입력을 받는다. */
function addTabButton(text, onPick) {
  const b = document.createElement("button");
  b.className = "bar-tab bar-tab--add";
  b.type = "button";
  b.textContent = text;
  b.addEventListener("click", () => onPick(b));
  return b;
}

function drawBars() {
  const here = projects.active();
  const toLeft = value("projectTabs") === "left";
  /* 레일은 왼쪽 모드에서만 만든다. 숨기지 않고 제거한다. [hidden] 은 display 를
     정하는 규칙을 이기지 못하고 .rail-projects 는 display:flex 이므로, 숨기면 빈
     영역이 남는다. 크롬 행은 반대로 항상 둔다. 비어 있어도 그 행이 버튼들을
     오른쪽으로 밀어낸다. */
  let rail = shell.querySelector(".rail-projects");
  if (toLeft && !rail) {
    rail = document.createElement("div");
    rail.className = "rail-projects";
    shell.prepend(rail);
  } else if (!toLeft && rail) {
    rail.remove();
    rail = null;
  }
  const into = toLeft ? rail : projectBar;
  projectBar.textContent = "";
  if (rail) rail.textContent = "";

  for (const p of projects.all()) {
    into.appendChild(tab(p.title, p.id === here.id, {
      dot: p.color,
      onPick: () => { projects.activate(p.id); drawBars(); },
      onRename: (title) => projects.rename(p.id, { title }),
      onClose: projects.all().length > 1
        // 배경에 있던 것을 닫으면 판은 그대로다. 살아 있어야 할 표면 목록은
        // 커밋에서만 전달되므로, 닫은 뒤 한 번 게시해 그 표면을 없앤다.
        ? () => { projects.close(p.id); drawBars(); publish(); } : null,
    }));
  }
  into.appendChild(addTabButton("+", openProject));

  spaceBar.textContent = "";
  for (const sp of here.spaces) {
    spaceBar.appendChild(tab(sp.title, sp.id === here.activeSpaceId, {
      onPick: () => { projects.activateSpace(sp.id); drawBars(); },
      onRename: (title) => projects.renameSpace(sp.id, title),
      onClose: here.spaces.length > 1
        ? () => { projects.closeSpace(sp.id); drawBars(); publish(); } : null,
    }));
  }
  spaceBar.appendChild(addTabButton("+", () => { projects.addSpace(fresh()); drawBars(); }));

  chromeActs.textContent = "";
  chromeActs.append(
    act("panel-left", "좌측 자리", value("left"), () => set({ left: !value("left") })),
    act("panel-right", "우측 자리", value("right"), () => set({ right: !value("right") })),
    // 모달의 모드 세그먼트와 같은 경로다. applyTheme 은 테마의 형태 값까지 다시
    // 적용하므로, 그것을 부르면 사용자가 정한 통로와 모서리가 되돌아간다.
    act(modeName() === "dark" ? "sun" : "moon", "밝게 / 어둡게", false,
        () => set({ mode: modeName() === "dark" ? "light" : "dark" })),
    // 모달이 열린 동안에는 오버레이가 이 버튼을 덮으므로 다시 눌리지 않는다. 켜짐
    // 상태도 표시하지 않는다. 구 프로젝트의 settings-toggle 과 같다.
    act("settings", "설정", false, openSettings),
  );
}

/**
 * 그 자리에서 루트를 입력받아 프로젝트를 연다.
 *
 * 같은 루트는 기존 프로젝트를 활성화한다. 정체성이 root 이므로 중복해서 열지 않는다.
 */
function openProject(from) {
  const input = document.createElement("input");
  input.className = "bar-tab__root";
  input.placeholder = "~/Work/…";
  from.replaceWith(input);
  input.focus();
  const done = (take) => {
    const root = input.value.trim();
    input.remove();
    if (take && root) {
      projects.open({
        root,
        // 목록의 길이로 고르면 하나를 닫은 뒤 다음 프로젝트가 이미 쓰인 색을
        // 받는다. 열린 색을 피해 고른다.
        color: TINTS.find((t) => !projects.all().some((p) => p.color === t)) ?? TINTS[0],
        layout: fresh(),
      });
    }
    drawBars();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") done(true);
    if (e.key === "Escape") done(false);
  });
  input.addEventListener("blur", () => done(true));
}

/** 프로젝트 구분 색. 사용자가 지정하기 전까지 사용하는 값이다. */
const TINTS = ["#ffb36b", "#7fe3b0", "#7db4ff", "#e08bd8", "#f2d16b"];


build();

/* 첫 프로젝트는 방금 만든 판을 그대로 받는다. 루트가 정체성이므로 같은 루트를 다시
   열면 이 프로젝트를 활성화한다. */
projects.open({
  root: "~/Work/soksak",
  color: TINTS[0],
  layout: capture(),
});
drawBars();

/* ⚙ 의 값이 아닌 누름. 이 문서가 판을 소유하므로 여기서 수행한다. */
onCommand((name) => {
  if (name !== "build") return;
  build();
  drawBars();
  drawSettings();
});

/* 합성 손잡이가 바뀌면 다시 그린다. 손잡이는 렌더에서 읽히므로 다시 그리지 않으면
   바꾼 값이 나타나지 않는다. */
onKnobChange(() => settle());

/* 설정이 바뀌면 판과 크롬을 다시 그린다. 첫 프로젝트를 만든 뒤에 등록한다. 그 전에
   호출되면 그릴 프로젝트가 없다. */
onSettingsChange(() => {
  const half = halfGap();
  setGap(half);
  settle();
  drawBars();
  drawSettings();
});

/* 창 크기가 바뀌면 SoksakView 의 ResizeObserver 가 다시 그린다. 여기서 같은
   것을 관측하면 옵저버가 둘이 되고, 하나가 이전 크기로 배치한 뒤 다른 하나가 다시
   배치한다. */

</script>
</body></html>
