<!doctype html>
<meta charset="utf-8">
<title>terminal</title>
<!--
  터미널 표면. 창 안의 웹뷰이고 셸 프로세스가 연결된다.

  터미널 에뮬레이터가 아니라 콘솔이다. 출력은 텍스트이고 입력은 한 줄 단위다.

  셸을 호출하는 방식은 애플리케이션마다 다르고 framework/ 가 그 차이를 담당한다.
-->
<style>
  html, body { margin: 0; height: 100%; background: var(--surface) }
  body {
    display: flex; flex-direction: column;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--surface-fg);
  }
  #out { flex: 1 1 auto; margin: 0; padding: 6px 9px; overflow-y: auto;
         white-space: pre-wrap; word-break: break-word }
  #line { display: flex; gap: 6px; padding: 4px 9px 6px;
          border-top: 1px solid color-mix(in srgb, var(--surface-fg) 22%, transparent) }
  #line span { color: color-mix(in srgb, var(--surface-fg) 55%, transparent) }
  #in { flex: 1 1 auto; min-width: 0; border: 0; background: transparent;
        color: inherit; font: inherit; outline: 0 }
</style>
<pre id="out"></pre>
<div id="line"><span>$</span><input id="in" autocomplete="off" spellcheck="false"></div>
<script type="module">
  import { page } from "./framework/index.js";
  import { followTheme } from "./theme.js";

  followTheme();

  const id = new URLSearchParams(location.search).get("id");
  const out = document.getElementById("out");
  const input = document.getElementById("in");

  function write(text) {
    // 이미 맨 아래에 있을 때만 맨 아래로 스크롤한다. 위로 올려 둔 것을 새 출력이
    // 되돌리지 않는다.
    const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
    out.append(text);
    if (atEnd) out.scrollTop = out.scrollHeight;
  }

  page.shell.onOutput(id, write);
  page.shell.open(id);

  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const line = input.value;
    input.value = "";
    write(`$ ${line}\n`);
    page.shell.write(id, `${line}\n`);
  });

  addEventListener("click", () => input.focus());
  input.focus();
</script>
