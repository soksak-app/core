<!doctype html>
<meta charset="utf-8">
<title>browser</title>
<!--
  브라우저 표면. 주소창과 문서 영역으로 이루어진다.

  외부 문서는 이 페이지가 아니라 호스트가 문서 영역 요소 위에 둔 문서 웹뷰에 열린다
  (docs/spec/native-surfaces.md 의 "문서 영역"). 이 페이지는 주소창을 그리고, 선언한 명령으로
  문서 영역을 조작하고, 호스트가 알린 문서 상태를 browser.location 으로 공개한다.
  처음 여는 주소는 plugin.json 의 home 이다.
-->
<style>
  /* 주소창은 카드 머리와 같은 창 요소이므로 카드 토큰으로 그린다. 표면 토큰은 셸 같은 콘텐츠 표면의 색이다. */
  html, body { margin: 0; height: 100%; background: transparent }
  body {
    display: flex; flex-direction: column;
    font: 12px/1.4 var(--font);
    color: var(--fg);
  }
  #bar { position: relative; display: flex; align-items: center; gap: 2px; padding: 4px 6px;
         background: var(--card);
         border-bottom: 1px solid var(--rule) }
  #buttons { display: flex; gap: 2px }
  #bar button { width: 24px; height: 22px; border: 0; border-radius: 4px; padding: 0;
                background: transparent; color: inherit; font: inherit; font-size: 14px; cursor: default }
  #bar button:hover:not(:disabled) { background: var(--rule) }
  #bar button:disabled { opacity: .35 }
  #address { flex: 1 1 auto; min-width: 0; height: 22px; margin-left: 4px; padding: 0 8px; box-sizing: border-box;
             border: 1px solid var(--edge); border-radius: 5px;
             background: transparent; color: inherit; font: inherit; outline: 0 }
  #address:focus { border-color: var(--focus) }
  #progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0;
              background: var(--rail); transition: width .15s }
  #document { position: relative; flex: 1 1 auto; min-height: 0 }
  #error { margin: 0; padding: 4px 9px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
           background: var(--card);
           border-bottom: 1px solid var(--rule); color: var(--no) }
</style>
<div id="bar">
  <span id="buttons"><button type="button" id="back" data-expose="browser.back" data-command="browser.back"
    title="뒤로" disabled>‹</button><button type="button" id="forward" data-expose="browser.forward"
    data-command="browser.forward" title="앞으로" disabled>›</button><button type="button" id="reload"
    data-expose="browser.reload" data-command="browser.reload" title="새로고침">↻</button></span>
  <input id="address" data-expose="browser.address" autocomplete="off" spellcheck="false" aria-label="주소">
  <div id="progress" hidden></div>
</div>
<p id="error" role="status" hidden></p>
<div id="document" data-expose="browser.document"></div>
<script type="importmap">
{"imports": {
  "soksak": "/modules/soksak/dist/index.js",
  "@soksak/plugin-api": "/modules/@soksak/plugin-api/index.js",
  "@soksak/plugin-api/page": "/modules/@soksak/plugin-api/page.js",
  "@soksak/runtime": "/runtime/index.js",
  "@soksak/workbench/": "/"
}}
</script>
<script type="module">
  import { createSurfaceComposition, expose, followTheme, ownManifest } from "@soksak/plugin-api/page";

  const themed = followTheme();

  const buttons = document.getElementById("buttons");
  const back = document.getElementById("back");
  const forward = document.getElementById("forward");
  const address = document.getElementById("address");
  const reload = document.getElementById("reload");
  const progress = document.getElementById("progress");
  const failure = document.getElementById("error");
  const area = document.getElementById("document");

  /** 호스트가 마지막으로 알린 문서 상태. 첫 알림 전에는 빈 문서다. */
  let current = {
    url: "", title: "", loading: false, progress: 0,
    canGoBack: false, canGoForward: false, error: null, scroll: { x: 0, y: 0 },
  };
  const watchers = new Set();

  /** 주소창의 글을 주소로 바꾼다. 스킴이 없으면 https 로 연다. */
  const addressOf = (text) => {
    const trimmed = text.trim();
    return /^[a-z][a-z0-9+.-]*:/i.test(trimmed) ? trimmed : `https://${trimmed}`;
  };

  function show(state) {
    current = state;
    // 입력 중인 주소는 덮어쓰지 않는다.
    if (document.activeElement !== address) address.value = state.url;
    back.disabled = !state.canGoBack;
    forward.disabled = !state.canGoForward;
    // 읽는 동안 이 단추는 멈춤이다. 위임한 누름은 누를 때의 data-command 를 실행한다.
    reload.dataset.command = state.loading ? "browser.stop" : "browser.reload";
    reload.textContent = state.loading ? "×" : "↻";
    reload.title = state.loading ? "멈춤" : "새로고침";
    progress.hidden = !state.loading;
    progress.style.width = `${Math.round(state.progress * 100)}%`;
    failure.hidden = state.error === null;
    failure.textContent = state.error ?? "";
    document.title = state.title || state.url || "browser";
    for (const fn of watchers) fn(state);
  }

  const fail = (error) => show({ ...current, error: error.message });

  // 주소창을 눌러 초점을 옮기면 주소 전체를 선택한다. 그 누름을 뗄 때 선택이 풀리지 않게 한다.
  let selecting = false;
  address.addEventListener("pointerdown", () => { selecting = document.activeElement !== address; });
  address.addEventListener("focus", () => address.select());
  address.addEventListener("mouseup", (e) => {
    if (selecting) e.preventDefault();
    selecting = false;
  });

  const composition = await createSurfaceComposition({ regions: { page: area } });
  const region = composition.region("page");
  region.onState(show);

  await themed;
  await Promise.all([
    expose.status("browser.location", () => current, (fn) => {
      watchers.add(fn);
      return () => watchers.delete(fn);
    }),
    expose.command("browser.navigate", async ({ url }) => {
      if (typeof url !== "string" || url === "") throw new Error("browser.navigate requires a url");
      await region.load(url);
      return null;
    }),
    expose.command("browser.back", () => region.back()),
    expose.command("browser.forward", () => region.forward()),
    expose.command("browser.reload", () => region.reload()),
    expose.command("browser.stop", () => region.stop()),
    expose.dom("browser.address", address),
    expose.dom("browser.back", back),
    expose.dom("browser.forward", forward),
    expose.dom("browser.reload", reload),
    expose.dom("browser.document", area),
  ]);

  // 단추는 누를 때의 data-command 가 가리키는 명령을 실행한다. 주소창은 위임 루트 밖에 있고,
  // Enter 가 입력한 주소를 browser.navigate 로 연다.
  await expose.delegate(buttons, { failed: fail });
  await expose.bind(address, "browser.navigate", () => {
    const url = addressOf(address.value);
    address.blur();
    return { url };
  }, { event: "keydown", when: (e) => e.key === "Enter" && !e.isComposing, failed: fail });

  const { home } = await ownManifest();
  if (home) region.load(home).catch(fail);
</script>
