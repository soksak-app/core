<!doctype html>
<meta charset="utf-8">
<title>terminal</title>
<!--
  터미널 표면. 창 안의 웹뷰이고 VT 엔진 세션이 연결된다.

  이미지 영역을 사용하여 셀 단위의 터미널 화면을 표시한다. 입력은
  키와 포인터 이벤트로 처리한다.
-->
<style>
  html, body { margin: 0; height: 100%; background: var(--surface) }
  body {
    display: flex; flex-direction: column;
    font: inherit;
    color: var(--surface-fg);
  }
  #view { flex: 1 1 auto; outline: 0; tabindex: 0 }
</style>
<div id="view" data-expose="terminal.view" tabindex="0"></div>
<script type="importmap">
{"imports": {
  "soksak": "/modules/soksak/dist/index.js",
  "@soksak/plugin-api": "/modules/@soksak/plugin-api/index.js",
  "@soksak/plugin-api/page": "/modules/@soksak/plugin-api/page.js",
  "@soksak/runtime": "/runtime/index.js",
  "@soksak/workbench/": "/"
}}
</script>
<script type="module">
  import { expose, followTheme, attachImageRegion, page } from "@soksak/plugin-api/page";
  import { startTerminal } from "./terminal.js";

  const themed = followTheme();

  const view = document.getElementById("view");

  // 터미널 사이드카가 이 표면의 VT 세션을 실행한다.
  const terminal = page.sidecar("@soksak/sidecar-vt-alacritty");

  // 공개 항목은 첫 테마를 적용한 뒤 등록한다.
  await themed;
  await startTerminal({
    view,
    attachImage: attachImageRegion,
    sidecar: terminal,
    expose,
    scale: devicePixelRatio,
    window,
  });
</script>
