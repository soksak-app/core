<!doctype html>
<meta charset="utf-8">
<title>shell</title>
<!--
  셸 표면. 창 안의 웹뷰이고 셸 프로세스가 연결된다.

  터미널 에뮬레이터가 아니라 콘솔이다. 출력은 줄 단위 텍스트이고 입력은 한 줄 단위다.
  출력은 줄마다 요소 하나로 그려 보이는 줄을 잴 수 있게 한다.

  셸 세션은 shell 사이드카가 실행하고, 네이티브 호스트가 메시지를 전달한다.
-->
<style>
  html, body { margin: 0; height: 100%; background: var(--surface) }
  body {
    display: flex; flex-direction: column;
    font: 11px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--surface-fg);
  }
  #out { flex: 1 1 auto; margin: 0; padding: 6px 9px; overflow-y: auto;
         white-space: pre-wrap; word-break: break-word }
  #out > div { min-height: 1.45em }
  #line { display: flex; align-items: center; gap: 6px; padding: 4px 9px 6px;
          border-top: 1px solid color-mix(in srgb, var(--surface-fg) 22%, transparent) }
  #line span { color: color-mix(in srgb, var(--surface-fg) 55%, transparent) }
  #in { flex: 1 1 auto; min-width: 0; border: 0; background: transparent;
        color: inherit; font: inherit; outline: 0 }
  #line button { border: 0; padding: 0 2px; background: transparent; color: inherit;
                 font: inherit; opacity: .55; cursor: default }
  #line button:hover { opacity: 1 }
</style>
<div id="out" data-expose="shell.output"></div>
<div id="line"><span>$</span><input id="in" data-expose="shell.input" autocomplete="off" spellcheck="false"
  aria-label="명령"><button type="button" data-expose="shell.interrupt" data-command="shell.interrupt"
  title="실행 중인 명령 중단">^C</button><button type="button" data-expose="shell.clear"
  data-command="shell.clear" title="출력 지우기">⌫</button></div>
<script type="importmap">
{"imports": {
  "soksak": "/modules/soksak/dist/index.js",
  "@soksak/plugin-api": "/modules/@soksak/plugin-api/index.js",
  "@soksak/plugin-api/page": "/modules/@soksak/plugin-api/page.js",
  "@soksak/runtime": "/runtime/index.js",
  "@soksak/workbench/": "/"
}}
</script>
<script type="module">
  import { expose, followTheme, page } from "@soksak/plugin-api/page";

  const themed = followTheme();

  const id = new URLSearchParams(location.search).get("id");
  const out = document.getElementById("out");
  const input = document.getElementById("in");

  /* 공개 status 마다 값이 바뀔 때 호출할 함수. 감시가 등록한다. */
  const watchers = { output: new Set(), screen: new Set(), cwd: new Set(), runs: new Set() };
  const changed = (name) => { for (const fn of watchers[name]) fn(read[name]()); };
  const watch = (name) => (fn) => {
    watchers[name].add(fn);
    return () => watchers[name].delete(fn);
  };

  /** 줄바꿈으로 끝나지 않은 마지막 줄이 있는가. */
  let open = false;
  /** 셸이 마지막으로 보고한 현재 디렉터리. 첫 보고 전에는 null 이다. */
  let cwd = null;

  /** 줄 하나를 보이는 줄로 볼지 판단한다. 요소가 출력 영역의 보이는 범위와 겹치면 보인다. */
  const visible = (line) =>
    line.offsetTop + line.offsetHeight > out.scrollTop && line.offsetTop < out.scrollTop + out.clientHeight;

  const read = {
    /** 출력의 줄. 줄바꿈 문자는 포함하지 않는다. */
    output: () => [...out.children].map((line) => line.textContent),
    /** 지금 보이는 줄, 한 화면에 들어가는 줄 수, 스크롤 위치. */
    screen: () => {
      const height = parseFloat(getComputedStyle(out).lineHeight);
      return {
        lines: [...out.children].filter(visible).map((line) => line.textContent),
        rows: Math.floor(out.clientHeight / height),
        scrollTop: out.scrollTop,
      };
    },
    cwd: () => cwd,
    /** 사이드카에 전달했고 아직 끝나지 않은 shell.run 수. */
    runs: () => delivered.size,
  };

  function write(text) {
    // 이미 맨 아래에 있을 때만 맨 아래로 스크롤한다. 위로 올려 둔 것을 새 출력이
    // 되돌리지 않는다.
    const atEnd = out.scrollTop + out.clientHeight >= out.scrollHeight - 4;
    const parts = text.split("\n");
    parts.forEach((part, index) => {
      if (index > 0 || !open) {
        if (index === parts.length - 1 && part === "") return;
        out.append(document.createElement("div"));
      }
      out.lastElementChild.append(part);
    });
    open = !text.endsWith("\n");
    if (atEnd) out.scrollTop = out.scrollHeight;
    changed("output");
    changed("screen");
  }

  // 셸 사이드카가 이 표면의 셸 세션을 실행한다. plugin.json 이 이 사이드카를 의존성으로 선언한다.
  const shell = page.sidecar("@soksak/sidecar-shell");

  /** 답을 기다리는 실행 요청. id 로 찾는다. */
  const runs = new Map();
  /** 사이드카에 전달된 실행 요청의 id. 이 요청 뒤에 보낸 중단은 그 명령에 도달한다. */
  const delivered = new Set();
  let nextRun = 0;

  // 출력 수신을 등록한 뒤 셸을 연다. 먼저 열면 첫 출력이 등록 전에 도착할 수 있다.
  await shell.on(id, (body) => {
    if (body.id !== undefined) {
      const pending = runs.get(body.id);
      runs.delete(body.id);
      if (delivered.delete(body.id)) changed("runs");
      if (body.error !== undefined) pending?.reject(new Error(body.error));
      else pending?.resolve({ output: body.output, exit: body.exit });
    } else if (body.cwd !== undefined) {
      cwd = body.cwd;
      changed("cwd");
    } else if (body.error !== undefined) {
      write(`error: ${body.error}\n`);
    } else {
      write(body.text);
    }
  });
  const send = (body) => shell.send(id, body);
  // 요청 실패는 출력에 표시한다.
  send({ op: "open" }).catch((error) => write(`error: ${error.message}\n`));


  const fail = (error) => write(`error: ${error.message}\n`);

  // 출력 영역을 누르면 입력 줄에 초점을 둔다. 명령을 실행하지 않는 초점 이동이다.
  addEventListener("click", () => input.focus());
  out.addEventListener("scroll", () => changed("screen"));
  new ResizeObserver(() => changed("screen")).observe(out);
  input.focus();

  // 공개 항목은 첫 테마를 적용한 뒤 등록한다. 등록된 문서는 표시할 준비가 된 문서다.
  await themed;
  await Promise.all([
    expose.status("shell.output", read.output, watch("output")),
    expose.status("shell.screen", read.screen, watch("screen")),
    expose.status("shell.cwd", read.cwd, watch("cwd")),
    expose.status("shell.runs", read.runs, watch("runs")),
    expose.command("shell.write", async ({ data }) => {
      if (typeof data !== "string") throw new Error("shell.write requires data");
      await send({ op: "write", data });
      return null;
    }),
    expose.command("shell.run", ({ command }) => {
      if (typeof command !== "string" || command === "") throw new Error("shell.run requires a command");
      const request = `run-${++nextRun}`;
      const done = new Promise((resolve, reject) => runs.set(request, { resolve, reject }));
      send({ op: "run", id: request, command }).then(() => {
        // 답이 먼저 왔으면 이미 끝난 요청이다.
        if (!runs.has(request)) return;
        delivered.add(request);
        changed("runs");
      }, (error) => {
        runs.get(request)?.reject(error);
        runs.delete(request);
      });
      return done;
    }),
    expose.command("shell.interrupt", async () => {
      await send({ op: "interrupt" });
      return null;
    }),
    expose.command("shell.clear", () => {
      out.replaceChildren();
      open = false;
      changed("output");
      changed("screen");
      return null;
    }),
    expose.dom("shell.input", input),
    expose.dom("shell.output", out),
    expose.dom("shell.interrupt", document.querySelector('[data-command="shell.interrupt"]')),
    expose.dom("shell.clear", document.querySelector('[data-command="shell.clear"]')),
  ]);

  // 조작은 선언된 명령에 연결한다. 단추는 data-command 가 가리키는 명령을 실행하고, 입력
  // 줄의 Enter 는 그 줄을 출력에 표시한 뒤 shell.write 로 셸에 보낸다.
  await expose.delegate(document.getElementById("line"), { failed: fail });
  await expose.bind(input, "shell.write", () => {
    const line = input.value;
    input.value = "";
    write(`$ ${line}\n`);
    return { data: `${line}\n` };
  }, { event: "keydown", when: (e) => e.key === "Enter", failed: fail });
</script>
