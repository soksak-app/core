# The fixture sidecar of the agent layout window check (docs/spec/cli.md#acting-on-a-layout): a sidecar on standard input and output
# that starts processes for surfaces (docs/spec/sidecars.md#processes-of-a-surface). It is its own workspace and not a member of the
# core workspace: the core build does not build it, and it keeps its own Cargo.lock and target/.
[workspace]

[package]
name = "sok-agentprobe"
version = "0.0.40"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "sok-agentprobe"
path = "src/main.rs"

[dependencies]
libc = "0.2.189"
serde_json = "1.0.151"

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
strip = true
