# The fake persistent sidecar of the core window checks (docs/spec/plugin-processes.md#verification-boundaries). It is its own
# workspace and not a member of the core workspace: the core build does not build it, and it keeps its own Cargo.lock and target/.
[workspace]

[package]
name = "rasterprobe-service"
version = "0.0.40"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "rasterprobe-service"
path = "src/main.rs"

[dependencies]
libc = "0.2.189"
serde_json = "1.0.151"

[build-dependencies]
serde_json = "1.0.151"

[profile.release]
strip = true
