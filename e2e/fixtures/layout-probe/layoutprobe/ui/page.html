<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout probe</title>
<style>html, body { height: 100%; margin: 0; background: var(--card); } #document { position: absolute; inset: 8px; }</style>
</head>
<body>
<div id="document"></div>
<!-- The text and the button that the theme check reads: their colors are the tokens of the view, drawn off the visible area. -->
<p id="probe-text" style="position: absolute; left: -10000px; top: 0; margin: 0; color: var(--fg);">probe text</p>
<button id="probe-button" style="position: absolute; left: -10000px; top: 0; color: var(--fg); background: var(--card);">probe button</button>
<script type="module" src="./app.js"></script>
</body>
</html>
